<ul>
<li>Lots of explanations to be explored</li>
<li>A simple Malthusian one:
<ul>
<li>modern medicine has lowered death rates but birth rates remain high.</li>
<li><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.054ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.242ex" role="img" focusable="false" viewBox="0 -525 1000 549"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="21D2" d="M580 514Q580 525 596 525Q601 525 604 525T609 525T613 524T615 523T617 520T619 517T622 512Q659 438 720 381T831 300T927 263Q944 258 944 250T935 239T898 228T840 204Q696 134 622 -12Q618 -21 615 -22T600 -24Q580 -24 580 -17Q580 -13 585 0Q620 69 671 123L681 133H70Q56 140 56 153Q56 168 72 173H725L735 181Q774 211 852 250Q851 251 834 259T789 283T735 319L725 327H72Q56 332 56 347Q56 360 70 367H681L671 377Q638 412 609 458T580 514Z"></path></g></g></g></svg></mjx-container> higher population and lower incomes.</li>

<h3 id="1-the-potato-and-the-irish-population">1. The Potato and the Irish Population</h3>
<ul>
<li>
<p>Potatoes yielded 2–4x more calories per acre than grain; thrived in poor, damp Irish soil.</p>
</li>
<li>
<p>Demographic Boom: Population doubled (4M to 8M+) between 1750–1845 as small plots could now support large families.</p>
</li>
<li>
<p>The Lumper Monoculture: Dependence on a single, high-yield variety created a &quot;genetic bottleneck&quot; with zero disease resistance.</p>
</li>
<li>
<p>The Blight: Phytophthora infestans arrived in 1845; the lack of genetic diversity caused total, rapid crop failure.</p>
</li>
</ul>
</section>

<h3 id="1-pre-famine-context-and-the-blight-1845%E2%80%931848">1. Pre-Famine Context and The Blight (1845–1848)</h3>

<ul>
<li data-marpit-fragment="1"><strong>The Potato Trap:</strong> High-calorie yields fueled a population surge to 8M+, but dangerous &quot;Lumper&quot; monoculture.</li>
<li data-marpit-fragment="2"><strong>Colonial Tenancy:</strong> A rigid land system left the Catholic majority as landless tenants-at-will, dependent on tiny plots.</li>
<li data-marpit-fragment="3"><strong>The Blight:</strong> <em>Phytophthora infestans</em> arrives in 1845, causing total collapse of the primary food source.</li>
<li data-marpit-fragment="4"><strong>Productivity Crash:</strong> Decimation of the potato crop destroyed real wages of the rural poor, causing immediate destitution.</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-fragments="4" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}

;">
<h3 id="2-the-great-famine">2. The Great Famine</h3>
<ul>
<li data-marpit-fragment="1"><strong>Entitlement Failure:</strong> Starvation occurred amid plenty; Ireland remained a net <strong>exporter</strong> of grain and livestock to England.</li>
<li data-marpit-fragment="2"><strong>Ideological Failure:</strong> <em>Laissez-faire</em> policy and &quot;Poor Laws&quot; prioritized market mechanics and property rights over direct relief.</li>
<li data-marpit-fragment="3"><strong>The &quot;Clearing&quot;:</strong> Rent defaults triggered mass evictions, allowing landlords to consolidate small plots into large-scale cattle grazing.</li>
<li data-marpit-fragment="4"><strong>Demographic Scarring:</strong> 1 million dead; 1 million+ emigrated. Population has never returned to its 1845 peak.</li>
<li data-marpit-fragment="5"><strong>Political Aftermath:</strong> Perceived British indifference fueled century-long resentment and Irish nationalist movements.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-marpit-fragments="4" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}

;">
<h3 id="3-malthusian-classical-orthodoxy">3. Malthusian Classical Orthodoxy</h3>
<ul>
<li data-marpit-fragment="1"><strong>The Malthusian Trap:</strong> Famine was framed as a &quot;natural check&quot; on a population that had geometrically outstripped its food supply.</li>
<li data-marpit-fragment="2"><strong>The &quot;Iron Law&quot;:</strong> Based on the <em>Iron Law of Wages</em>, officials feared that providing food would artificially lower mortality, leading to an even larger population collapse later.</li>
<li data-marpit-fragment="3"><strong>New Poor Law (1834):</strong> The Malthusian framework mandated that relief be &quot;less eligible&quot; (worse) than the lowest paid labor, forcing the starving into punitive workhouses.</li>
<li data-marpit-fragment="4"><strong>Moralism:</strong> High-ranking officials like Charles Trevelyan viewed the blight as a &quot;divine mechanism&quot; to forcibly modernize Irish social and property structures.</li>
</ul>
</section>

<h2 id="quantys-versus-qualys">Quantys versus Qualys</h2>
<ul>
<li>Quantys: 'be fruitful and multiply'
<ul>
<li>4 children per family, 2 survive to adulthood</li>
<li>little investment in human capital</li>
<li>subsistence farmers, manual laborers, etc.</li>
</ul>
</li>
<li>Qualys: 2 children per family
<ul>
<li>2 survive to adulthood</li>
<li>heavier time and resource investment in child productivity/earning capacity</li>
<li>blacksmiths, traders, carpenters.</li>
</ul>
</li>
<li>Both groups maintaining shares in the population</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-marpit-fragments="1" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}

<h2 id="quantys-versus-qualys-1">Quantys versus Qualys</h2>
<h3 id="suppose-technological-development-boosts-demand-for-qualy-services">Suppose technological development boosts demand for qualy services</h3>
<ul>
<li>raises income or Qualys relative to Quantys (an evolutionary advantage)</li>
<li>Over time raise family size from 2 to 3 children</li>
<li>Still below rate of Quantys, but now more Qualy children reach maturity</li>
</ul>
<p>Positive feedback loop</p>
<ul>

<h3 id="elements-of-galors-unified-theory">Elements of Galor's Unified Theory</h3>
<p>Population size and Composition foster progress via:</p>
<ul>
<li data-marpit-fragment="1">supply of innovations</li>
<li data-marpit-fragment="2">Demand for innovations</li>
<li data-marpit-fragment="3">Diffusion of Knowledge</li>
<li data-marpit-fragment="4">Division of Labor</li>
<li data-marpit-fragment="5">Extent of Trade</li>
</ul>
<p>Traits complementary to the growth process<br />
(transmitted culturally as norms/customs)</p>
<ul>
<li>
<p>Generated higher incomes</p>
<ul>
<li>capital accumulation</li>
<li>future-orientation</li>
</ul>
</li>
<li>
<p>Adaptation</p>
</li>
<li></li>
</ul>

<h2 id="from-malthus-to-solow">From Malthus to Solow</h2>

<ul>
<li>population growth is exponential, land is fixed (non-accumulated).</li>
<li>One time improvement in technology <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="4.588ex" height="1.645ex" role="img" focusable="false" viewBox="0 -716 2027.8 727"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D434" d="M208 74Q208 50 254 46Q272 46 272 35Q272 34 270 22Q267 8 264 4T251 0Q249 0 239 0T205 1T141 2Q70 2 50 0H42Q35 7 35 11Q37 38 48 46H62Q132 49 164 96Q170 102 345 401T523 704Q530 716 547 716H555H572Q578 707 578 706L606 383Q634 60 636 57Q641 46 701 46Q726 46 726 36Q726 34 723 22Q720 7 718 4T704 0Q701 0 690 0T651 1T578 2Q484 2 455 0H443Q437 6 437 9T439 27Q443 40 445 43L449 46H469Q523 49 533 63L521 213H283L249 155Q208 86 208 74ZM516 260Q516 271 504 416T490 562L463 519Q447 492 400 412L310 260L413 259Q516 259 516 260Z"></path></g><g data-mml-node="mo" transform="translate(1027.8,0)"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container>

<li>income per capita <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.464ex;" xmlns="http://www.w3.org/2000/svg" width="1.109ex" height="1.464ex" role="img" focusable="false" viewBox="0 -442 490 647"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D466" d="M21 287Q21 301 36 335T84 406T158 442Q199 442 224 419T250 355Q248 336 247 334Q247 331 231 288T198 191T182 105Q182 62 196 45T238 27Q261 27 281 38T312 61T339 94Q339 95 344 114T358 173T377 247Q415 397 419 404Q432 431 462 431Q475 431 483 424T494 412T496 403Q496 390 447 193T391 -23Q363 -106 294 -155T156 -205Q111 -205 77 -183T43 -117Q43 -95 50 -80T69 -58T89 -48T106 -45Q150 -45 150 -87Q150 -107 138 -122T115 -142T102 -147L99 -148Q101 -153 118 -160T152 -167H160Q177 -167 186 -165Q219 -156 247 -127T290 -65T313 -9T321 21L315 17Q309 13 296 6T270 -6Q250 -11 231 -11Q185 -11 150 11T104 82Q103 89 103 113Q103 170 138 262T173 379Q173 380 173 381Q173 390 173 393T169 400T158 404H154Q131 404 112 385T82 344T65 302T57 280Q55 278 41 278H27Q21 284 21 287Z"></path></g></g></g></svg></mjx-container> falls back toward subsistence.</li>

<h2 id="solow-growth-model">Solow Growth Model</h2>
<p>The early main &quot;neo-classical growth model&quot;:</p>

<li>Production with labor and capital (could add human capital).</li>
<li>Unlike land, capital can be accumulated via saving/investment.</li>

<p><strong>Solow (neo-classical) growth model:</strong> capital is accumulated.</p>
<ul>
<li>growing population of workers can be equipped with new capital.
<ul>
<li>capital accumulation subject to diminishing returns.</li>

<h2 id="neo-classical-growth-more-generally">Neo-classical growth more generally</h2>
<ul>
<li>
<p>Convergence in per-capita incomes across countries, via any that tends to equalize technology and capital/worker ratios across countries.  Market-based mehanisms will do the job:</p>
<ul>
<li><strong>via capital accumulation</strong> and/or international <strong>capital flows</strong>.</li>
<li>via <strong>labor flows</strong> across countries</li>
<li>via comparative advantage and <strong>trade</strong>.</li>
</ul>
</li>
<li>
<p>Premised on no market failures and diminishing returns to capital.</p>
</li>
<li>
<p>Development policy implications:</p>
<ul>
<li>Let markets do their job: Liberalize, privatize, deregulate.</li>
<li>Poor countries are poor because of distortions to markets.</li>
</ul>
</li>
</ul>
