<h2 id="technology-and-labor-in-historical-perspective">Technology and Labor in Historical Perspective</h2>
<ul>
<li>Over the semester, we have examined the British Industrial Revolution, American frontier settlement, slavery, and the East Asian economic expansions.</li>
<li>A central question connects these transitions: Does technological change primarily displace workers, or does it generate new employment?</li>
<li>The historical record suggests the outcome depends heavily on the institutional framework.</li>
<li>Today, we use the Acemoglu and Restrepo (2019) framework to connect these historical cases to the modern automation and AI debate.</li>
</ul>
</section>

<h2 id="the-direction-of-technological-change">The Direction of Technological Change</h2>
<ul>
<li>Tech change is not neutral, inevitable force.</li>
<li>The <em>direction</em> of innovation—whether it saves labor or creates new industries—is shaped by incentives.</li>
<li>Determinants include:
<ul>
<li><strong>Factor Endowments:</strong> The relative scarcity and cost of land, labor, and capital.</li>
<li><strong>Market Environment:</strong> Scale and elasticity of demand.</li>
<li><strong>Institutions:</strong> Property rights, tax policy, labor laws, bargaining power of labor and capital.</li>
</ul>
</li>
</ul>

<h2 id="the-task-based-model-of-production">The Task-Based Model of Production</h2>

<li>In that framework, adding capital generally makes labor more productive.</li>
<li>Acemoglu &amp; Restrepo argue this misses the mechanics of the shop floor. They model production as a <strong>continuum of discrete tasks</strong>.</li>
<li><strong>Automation</strong> occurs when capital specifically replaces labor in a given task.</li>
</ul>

<h2 id="three-competing-forces">Three Competing Forces</h2>
<ol>
<li><strong>Displacement Effect:</strong> Automation pushes labor out of specific tasks, reducing the labor share of value and placing downward pressure on wages.</li>
<li><strong>Productivity Effect:</strong> Machines lower production costs, leading to lower prices and increased overall output. This raises demand for labor in non-automated tasks.</li>
<li><strong>Reinstatement Effect:</strong> Technological change can also create <strong>new tasks</strong> where humans hold a comparative advantage, pulling labor back into production.</li>
</ol>
</section>

<h2 id="1-britain-displacement-and-the-handloom-weavers">1. Britain: Displacement and the Handloom Weavers</h2>
<ul>
<li>How does this model apply to the early British Industrial Revolution?</li>
<li><strong>The Displacement Shock:</strong> The introduction of the power loom and spinning frame directly threatened the task share of highly skilled, well-paid artisans.</li>
<li>The Luddite movement (1811–1816) was not an irrational rejection of progress; it was a targeted response by textile workers experiencing a rapid, severe displacement effect that eroded their human capital and bargaining power.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-style="section {font-size: 27px;}

;--theme:gaia;" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;1s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;1s&quot;,&quot;builtinFallback&quot;:true}">
<h2 id="state-intervention-and-labors-bargaining-power">State Intervention and Labor's Bargaining Power</h2>
<ul>
<li>Why were the weavers ultimately unable to capture the productivity gains of mechanization?</li>
<li>The British state actively intervened to support capital owners and suppress labor organization.</li>
<li><strong>The Combination Acts (1799/1800)</strong> criminalized trade unionism and collective bargaining.</li>
<li><strong>The Frame Breaking Act (1812)</strong> made the destruction of mechanized looms a capital offense.</li>
<li><strong>The Result:</strong> With labor legally restrained and a growing supply of displaced rural workers, capital captured the productivity gains. Wages stagnated for decades (&quot;Engels' Pause&quot;).</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-style="section {font-size: 27px;}

<h2 id="automation-of-manufacturing-us-1899">Automation of Manufacturing (US, 1899)</h2>
<ul>
<li>To observe these task shifts at the micro-level, <em>Atack, Margo, and Rhode (2019)</em> use the 1899 &quot;Hand and Machine Labor&quot; study.</li>
<li>This study documented production methods before and after factory mechanization in the United States.</li>
<li>It focused strictly on the <strong>task level</strong>: what specifically does a worker do, and how long does it take?</li>
<li>A primary example: Making 100 pairs of medium-grade shoes.</li>
</ul>
</section>

<h2 id="the-shift-to-extreme-specialization">The Shift to Extreme Specialization</h2>
<ul>
<li>Under <strong>hand production</strong>: An artisan performed most tasks involved in making a shoe.</li>
<li>The median number of tasks per worker was 2 (and often much higher for masters).</li>
<li>Under <strong>machine production</strong>: The median tasks per worker fell to <strong>1</strong>.</li>
<li>Workers became highly specialized, allowing steam-powered machines to take over routine physical steps.</li>
</ul>
</section>

<h2 id="task-transitions-and-reinstatement">Task Transitions and Reinstatement</h2>
<ul>
<li>Mechanization subdivided complex tasks and consolidated others.</li>
<li>Crucially, it also generated <strong>new tasks</strong> (The Reinstatement Effect).</li>
<li>Approximately one-third of the tasks in machine production were new to the process.</li>
<li>Examples included maintaining steam engines, quality inspection, and specialized foreman supervision.</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-style="section {font-size: 27px;}
" data-theme="gaia" data-marpit-pagination="12" data-marpit-pagination-total="20" style="" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;1s&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;duration&quot;:&quot;1s&quot;,&quot;builtinFallback&quot;:true}" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-style="section {font-size: 27px;}

<h2 id="the-american-divergence-frontier-vs-coercion">The American Divergence: Frontier vs. Coercion</h2>
<ul>
<li><strong>The Free North (Habakkuk Thesis):</strong> An open frontier made free labor scarce and expensive. High wages <em>induced innovation</em> specifically aimed at saving labor (e.g., the McCormick reaper, interchangeable parts).</li>
<li><strong>The Coerced South (Slavery):</strong> Violent coercion artificially suppressed labor costs to subsistence levels.</li>
<li><strong>The Result:</strong> With access to guaranteed cheap labor, Southern planters had little financial incentive to invest in labor-saving technology. The region lagged in mechanization while the North industrialized.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-style="section {font-size: 27px;}

<h2 id="3-the-east-asian-miracles-induced-innovation">3. The East Asian Miracles: Induced Innovation</h2>
<ul>
<li>Economies like Japan, South Korea, and Taiwan experienced different technological trajectories, supported by early, widespread land reform.</li>
<li><strong>Induced Innovation:</strong> Rather than importing large, labor-displacing Western factories wholesale, they adapted technology to their specific factor endowments (scarce land, abundant labor).</li>
<li>They reverse-engineered Western designs to create smaller, appropriate machinery that could be utilized within extensive subcontracting networks.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-style="section {font-size: 27px;}

<h2 id="expanding-the-task-frontier">Expanding the Task Frontier</h2>
<ul>
<li>By adapting technology in this way, these economies generated a substantial <strong>Reinstatement Effect</strong>, expanding labor-intensive tasks in light manufacturing.</li>
<li><strong>Human Capital:</strong> State investments in education ensured the workforce could adapt to these new, increasingly complex tasks.</li>
<li><strong>Export Orientation:</strong> Competing in global markets provided highly elastic demand.</li>
<li><strong>The Result:</strong> A strong Productivity Effect. Output scaled rapidly, allowing labor demand to keep pace with displacement and driving sustained wage growth.</li>
</ul>
</section>

<h2 id="the-us-golden-age-1947%E2%80%931987">The US Golden Age (1947–1987)</h2>
<ul>
<li>Returning to the modern U.S. context, Acemoglu &amp; Restrepo label the post-WWII era a &quot;Golden Age.&quot;</li>
<li>While automation displaced workers during this period, it was matched by a consistent <strong>Reinstatement Effect</strong> (the creation of new tasks).</li>
<li>The net effect on the &quot;task content of production&quot; remained relatively stable.</li>
<li>Consequently, wages and employment grew in tandem with overall productivity.</li>
</ul>
</section>

<h2 id="a-structural-shift-1987%E2%80%932017">A Structural Shift (1987–2017)</h2>
<ul>
<li>The data indicates a notable shift in recent decades.</li>
<li><strong>Displacement</strong> has continued, driven by software, algorithms, and robotics.</li>
<li>However, the <strong>Reinstatement Effect</strong> has slowed significantly.</li>
<li>The authors suggest an increase in &quot;so-so&quot; technologies: innovations that are just efficient enough to replace human labor but fail to generate the large productivity gains needed to boost broader labor demand.</li>
</ul>
</section>

<h2 id="explaining-the-current-trajectory">Explaining the Current Trajectory</h2>
<ul>
<li>If the direction of technology is shaped by incentives, why the shift toward labor displacement?</li>
<li><strong>Institutional Bias:</strong> The current U.S. tax code tends to subsidize capital investment while taxing human labor (via payroll taxes).</li>
<li><strong>Industry Incentives:</strong> The venture capital model often prioritizes software designed to substitute for labor and reduce immediate payroll costs, rather than the longer-term investments required to generate new human-centric industries.</li>
</ul>
</section>

<h2 id="historical-summary">Historical Summary</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Regime</th>
<th style="text-align:left">Institutional / Factor Context</th>
<th style="text-align:left">Impact on Task Frontier</th>
<th style="text-align:left">Net Outcome</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Early Britain</strong></td>
<td style="text-align:left">State suppresses labor; enclosures increase supply.</td>
<td style="text-align:left">Displacement heavily outpaces Reinstatement.</td>
<td style="text-align:left">Wage stagnation (Engels' Pause).</td>
</tr>
<tr>
<td style="text-align:left"><strong>U.S. Frontier</strong></td>
<td style="text-align:left">Land abundance creates high wages for free labor.</td>
<td style="text-align:left">High wages induce automation; new factory tasks follow.</td>
<td style="text-align:left">High productivity &amp; wage growth.</td>
</tr>
<tr>
<td style="text-align:left"><strong>Slavery</strong></td>
<td style="text-align:left">Coercion enforces artificial subsistence labor.</td>
<td style="text-align:left">Stalls automation and new task creation.</td>
<td style="text-align:left">Technological stagnation.</td>
</tr>
<tr>
<td style="text-align:left"><strong>East Asia</strong></td>
<td style="text-align:left">Land reform + Export orientation.</td>
<td style="text-align:left">Adaptation drives Reinstatement + Productivity.</td>
<td style="text-align:left">Broad-based wage growth.</td>
</tr>
<tr>
<td style="text-align:left"><strong>Modern Era</strong></td>
<td style="text-align:left">Tax bias for capital + Silicon Valley incentives.</td>
<td style="text-align:left">Steady Displacement, slowing Reinstatement.</td>
<td style="text-align:left">Stagnant median wages, rising inequality.</td>
</tr>
</tbody>
</table>

<h2 id="concluding-thoughts">Concluding Thoughts</h2>
<ul>
<li>The Industrial Revolution fundamentally reorganized the allocation of tasks between capital and labor.</li>
<li>Economic history suggests that outcomes for workers are not strictly determined by the capabilities of new machines, but by the surrounding economic and political institutions.</li>
<li>Sustained wage growth generally requires technology directed toward creating new tasks, supported by policies that invest in human capital and maintain labor's bargaining position.</li>
</ul>
