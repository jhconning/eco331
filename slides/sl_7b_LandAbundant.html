<h2 id="1-the-factor-ratio-reversal">1. The Factor Ratio Reversal</h2>

<ul>
<li><strong>England (Old World):</strong> Land Scarcity / Labor Abundance.</li>
<li><strong>Americas (New World):</strong> Land Abundance / Labor Scarcity.</li>
<li><strong>The Paradox:</strong> Why did commercial settlement take so long?</li>
<li><strong>Diverging Paths:</strong> - <strong>South:</strong> Slavery &amp; Landed Elite.
<ul>
<li><strong>North:</strong> Family Farms &amp; Frontier.</li>
</ul>
</li>
</ul>
<footer>Eco 331: The Frontier Paradox</footer>

<h2 id="2-the-commercial-problem-solow">2. The Commercial Problem (Solow)</h2>
<ul>
<li><strong>Adam Smith's Fallacy:</strong> Abundant land <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.486ex;" xmlns="http://www.w3.org/2000/svg" width="1.76ex" height="2.106ex" role="img" focusable="false" viewBox="0 -716 778 931"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2260" d="M166 -215T159 -215T147 -212T141 -204T139 -197Q139 -190 144 -183L306 133H70Q56 140 56 153Q56 168 72 173H327L406 327H72Q56 332 56 347Q56 360 70 367H426Q597 702 602 707Q605 716 618 716Q625 716 630 712T636 703T638 696Q638 692 471 367H707Q722 359 722 347Q722 336 708 328L451 327L371 173H708Q722 163 722 153Q722 140 707 133H351Q175 -210 170 -212Q166 -215 159 -215Z"></path></g></g></g></svg></mjx-container> rapid wealth.</li>
<li><strong>The &quot;Staple&quot; Engine:</strong> Distance = &quot;Transport Tax.&quot;
<ul>
<li>Needs high-value exports (Sugar, Tobacco) to pay for trade.</li>
</ul>
</li>
<li><strong>The Subsistence Trap:</strong> - Labor disperses to the frontier for <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.339ex;" xmlns="http://www.w3.org/2000/svg" width="4.427ex" height="1.959ex" role="img" focusable="false" viewBox="0 -716 1956.5 866"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D434" d="M208 74Q208 50 254 46Q272 46 272 35Q272 34 270 22Q267 8 264 4T251 0Q249 0 239 0T205 1T141 2Q70 2 50 0H42Q35 7 35 11Q37 38 48 46H62Q132 49 164 96Q170 102 345 401T523 704Q530 716 547 716H555H572Q578 707 578 706L606 383Q634 60 636 57Q641 46 701 46Q726 46 726 36Q726 34 723 22Q720 7 718 4T704 0Q701 0 690 0T651 1T578 2Q484 2 455 0H443Q437 6 437 9T439 27Q443 40 445 43L449 46H469Q523 49 533 63L521 213H283L249 155Q208 86 208 74ZM516 260Q516 271 504 416T490 562L463 519Q447 492 400 412L310 260L413 259Q516 259 516 260Z"></path></g><g data-mml-node="msub" transform="translate(750,0)"><g data-mml-node="mi"><path data-c="1D443" d="M287 628Q287 635 230 637Q206 637 199 638T192 648Q192 649 194 659Q200 679 203 681T397 683Q587 682 600 680Q664 669 707 631T751 530Q751 453 685 389Q616 321 507 303Q500 302 402 301H307L277 182Q247 66 247 59Q247 55 248 54T255 50T272 48T305 46H336Q342 37 342 35Q342 19 335 5Q330 0 319 0Q316 0 282 1T182 2Q120 2 87 2T51 1Q33 1 33 11Q33 13 36 25Q40 41 44 43T67 46Q94 46 127 49Q141 52 146 61Q149 65 218 339T287 628ZM645 554Q645 567 643 575T634 597T609 619T560 635Q553 636 480 637Q463 637 445 637T416 636T404 636Q391 635 386 627Q384 621 367 550T332 412T314 344Q314 342 395 342H407H430Q542 342 590 392Q617 419 631 471T645 554Z"></path></g><g data-mml-node="mi" transform="translate(675,-150) scale(0.707)"><path data-c="1D43F" d="M228 637Q194 637 192 641Q191 643 191 649Q191 673 202 682Q204 683 217 683Q271 680 344 680Q485 680 506 683H518Q524 677 524 674T522 656Q517 641 513 637H475Q406 636 394 628Q387 624 380 600T313 336Q297 271 279 198T252 88 <li>This &quot;suction pump&quot; makes hiring labor for a surplus impossible.</li>

<h2 id="4-domars-trilemma">4. Domar’s Trilemma</h2>
<p><strong>The Impossible Trinity</strong></p>
<p>Pick <strong>two</strong>, and only two:</p>
<ol>
<li><strong>Free Land</strong> (Open Frontier)</li>
<li><strong>Free Labor</strong> (Mobility)</li>
<li><strong>Landed Elite</strong> (Rentiers)</li>
</ol>
<ul>
<li><strong>The Conflict:</strong> If land is free, labor must be bound to extract rent.</li>
</ul>
<footer>Eco 331: The Frontier Paradox</footer>

<h2 id="6-spanish-america-the-demographic-lottery">6. Spanish America: The Demographic Lottery</h2>
<ul>
<li><strong>Spain's Advantage:</strong> Hit sedentary, already &quot;enclosed&quot; populations (Aztecs, Incas).</li>
<li><strong>No Exit Option:</strong> Indigenous labor was tied to established systems.</li>
<li><strong>Contrast:</strong> British N. America had mobile populations and a &quot;leaky&quot; frontier.</li>
<li>Spain co-opted an existing hierarchy; Britain had to invent one.</li>
</ul>
<footer>Eco 331: The Frontier Paradox</footer>

<ul>
<li><strong>Soil Depletion:</strong> Tobacco is &quot;nitrogen-hungry.&quot;
<ul>
<li>Fields exhausted in <strong>3-5 years</strong>.</li>
</ul>
</li>
<li><strong>Physical Dispersal:</strong> Planters forced to constantly move west for fresh soil.</li>
<li><strong>The Paradox:</strong> The crop that funded the colony also pushed labor further from the center, weakening control.</li>
</ul>

<h2 id="8-indenture-the-credit-market-1620-1680">8. Indenture: The Credit Market (1620-1680)</h2>
<ul>
<li><strong>Passage Cost:</strong> £5–£10 (Equivalent to ~2 years of wages).</li>
<li><strong>The Forward Contract:</strong> Labor provided as collateral for the &quot;loan&quot; of passage.</li>
<li><strong>Servant Pipeline:</strong> 50% to 66% of all white immigrants to the Chesapeake arrived indentured.</li>
<li><strong>The &quot;Leaky&quot; Solution:</strong> Every 5 years, labor graduated to the frontier (Freedom Dues).</li>
</ul>

<h2 id="9-the-navigation-acts-1651-1660">9. The Navigation Acts (1651, 1660)</h2>
<ul>
<li><strong>The Mercantilist Squeeze:</strong> Colonial staples (Tobacco) could only ship to England on English ships.</li>
<li><strong>The &quot;Transport Tax&quot;:</strong> Squeezed the profit margins of small frontier planters.</li>
<li><strong>Bacon's Fuel:</strong> Lowered income for those already struggling on the marginal land of the frontier.</li>
<li><strong>Trade Impact:</strong> Forced the growth of London as a mandatory hub.</li>
</ul>

<h2 id="10-bacons-rebellion-1676-the-crisis">10. Bacon’s Rebellion (1676): The Crisis</h2>
<ul>
<li><strong>The &quot;Dangerous Unity&quot;:</strong> Nathaniel Bacon leads a coalition of poor whites, servants, and enslaved Africans.</li>
<li><strong>The Target:</strong> The Jamestown &quot;Coastal Elite&quot; (Governor Berkeley).</li>
<li><strong>The Logic:</strong> A collective exercise of the <strong>Exit Option</strong> against a gentry that held the best land and taxed the rest.</li>
<li>Jamestown is burned; the elite flees.</li>
</ul>
