<p>What role did this play in Europe becoming rich?</p>
</li>
<li>
<p>In other parts of the world remaining or becoming poor?</p>
</li>
<li>
<p>How did North America develop?</p>

<h3 id="legacies-of-colonialism">Legacies of Colonialism</h3>
<ul>
<li>The colonial powers exploited the natural resources of their colonies
<ul>
<li>Precious metals (South America) ,  Rubber (Congo),  Sugar (Caribbean, Brazil), Spices and sugar (Indonesia), Oil (Middle East),  Slave trade itself</li>
</ul>
</li>
<li>Cheap inputs and labor from the colonies allowed for dramatic economic expansion in Western Europe</li>
<li>Debate: How much of this is responsible for modern economic growth and prosperity?</li>
</ul>

<h3 id="how-colonization-mattered">How Colonization mattered</h3>
<ul>
<li>New World crops changed Eurasian diets<br />
Nunn and Qian (2010): potato explains one-quarter of Old World population growth/urbanization 1700-1900</li>
<li>Pomeranz (2000): key to Europe’s rise was new land (“ghost acreage”) in the New World, relieved population pressures and brought in new natural resources</li>
<li>Slave/coerced labor thought to play a role in Britain’s industrialization via cotton and sugar production</li>
</ul>

<h2 id="slavery-in-americas-and-the-caribbean">Slavery in Americas and the Caribbean</h2>
<ul>
<li>1440s Portuguese explore and establish African slave trading posts</li>
<li>15th C Spanish and Portuguese colonization of Caribbean and Americas</li>
<li>1600s Dutch, French, English Caribbean</li>
<li>1619 First slave captives to Jamestown colony</li>
<li>
<ul>
<li>Cheasapeake region, sugar, tobacco, rice</li>
</ul>
</li>
<li>1700s largest number of slaves transported in this century</li>
<li>1780s Peak of slave trade. Half transported on British ships.</li>
<li>1807 Great Britain abolishes slave trade with its colonies.</li>
<li>1808 US Congress bans importation of slaves (smuggling continues)</li>
<li>British Slave abolition act of 1834 frees slaves in British colonies</li>
<li>1863 Emancipation Proclamation frees slaves in US</li>
<li>1888 Brazil abolishes slavery</li>
</ul>

<h2 id="barbara-solow">Barbara Solow</h2>
<ul>
<li>
<p>Conventional Historical Accounts of rise of North America</p>
<ul>
<li>Smithian Vent-for-surplus and commercialization</li>
<li>Difference in factor endowments
<ul>
<li>immigration and convergence</li>
<li>over-time, growing specialization and eventual industrialization</li>
</ul>
</li>
</ul>
</li>
<li>
<p>This leaves several puzzles</p>
<ul>
<li>Settlement was late and slow.</li>
<li>Most migrants were indentured servants and slaves</li>
<li>Until early 1800s more African arrivals than Europeans</li>
<li>2/3 to Cheseapeake.  2/3 of Whites, 19/20 Africans</li>
<li>Southern Slavery vs. Northern Free Men/Soil ideology. Civil War.</li>
</ul>
</li>
</ul>
</section>

<h3 id="the-labor-supply-problem-and-political-economy">The Labor Supply Problem and Political Economy</h3>
<ul>
<li>Early political economists (e.g. Sir James Steuart, Sir William Petty, Richard Cantillon and the Physiocrats, Edward G. Wakefield) argued that the labor supply/discipline problem was key to understanding the economic development.</li>
<li>Elites frequently decried 'sloth and indolence' and legislated to compel employment. Poor Law Reform of 1834 criminalize 'idleness' and 'vagrancy.' Workhouses.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="14" data-marpit-pagination-total="55" style="--paginate:true;--style:section {font-size: 26px;}
;--theme:gaia;">
<ul>
<li>
<p>J. Bentham's (known for utilitarianism and defense of women and animal rights) also advocated 1798 Panopticon design (surveillance at prison and factories) and workhouse designs &quot;whole body of burdensome poor.&quot;</p>
<ul>
<li>Recommended that children start work at age 4 rather than 14). To be spared the loss of those “ten precious years in which nothing is done! Nothing for industry! Nothing for improvement, moral or intellectual!”</li>
</ul>
</li>
<li>
<p>Adam Smith and Ricardo's work became prominent more than a generation after 1776 Wealth of Nations publication.  Free Trade ideology became popular in the mid- and late 19C, after Britain established as empire and world's largest manufacturer.</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="15" data-marpit-pagination-total="55" style="--paginate:true;--style:section {font-size: 26px;}
;--theme:gaia;">
<p>In mid 18th C America, *<em>Benjamin Franklin</em> had argued</p>
<blockquote>
<p>It is impossible that manufactures should succeed in America from the high price of labour . This is occasioned by the great demand of labour for agriculture . A manufacturer from Europe will turn to labour of other kinds if he finds more can be got by it , and he finds some emploiments [ sic ] so profitable that he can lay up enough money to buy fifty acres of land to the culture of which he is irresistibly tempted by the independence in which it places him.</p>
</blockquote>
<p>Reflects arguments of early political economists and anticipates Wakefield.</p>
</section>

<ul>
<li>
<p>Wages will be low relative to rents in labor abundant (land scarce) areas.</p>
<ul>
<li>e.g. Europe in the 19th Century</li>
</ul>
</li>
<li>
<p>Wages will be high relative to rents in labor scarce (land abundant) areas.</p>
<ul>
<li>e.g. North America in the 19th Century</li>
</ul>
</li>
<li>
<p>Markets or Politics?  When might landlords use politics and force to change/establish property rights and market outcomes?</p>
<ul>
<li>When land is scarce, efforts to enclose (exclusive control of land)</li>
<li>When labor is scarce, efforts to restrict mobility (e.g. serfdom, slavery)</li>
</ul>
</li>
<li>
<p>Barbara Solow mentions the ideas of E.B. Wakefield and Evsy Domar on land and labor institutions in labor scarce environments.</p>
</li>
</ul>

<h4 id="evsey-domar-1970">Evsey Domar (1970)</h4>
<ul>
<li>Why did Russian frontier expansion in 16th C (rise in land/person) lead to imposition of new serfdom?</li>
<li>While Black Death in 14th C West (also rise in land/person) lead to collapse of old serfdom?</li>
</ul>
</section>

<h2 id="of-interest">Of interest</h2>
<p><a href="https://en.wikipedia.org/wiki/Paul_Krugman">Paul Krugman's</a> short essay: <a href="http://web.mit.edu/krugman/www/Serfdom.htm">&quot;Why I am an Economist (sigh)&quot;</a> interprets Domar's paper.</p>
<blockquote>
<p>Russia imposed strict restrictions on the mobility of peasants from the late 16th century onward, precisely because the availability of rich new farmland on the expanding frontier would otherwise have increased their bargaining power against landlords. (The frontier expansion itself was probably the result of the growing effectiveness of firearms, which turned the military balance against the steppe nomads; so gunpowder, which contributed to the rise of the bourgeoisie in the West, created serfdom in the East). And, of course, slavery - which, along with serfdom, had died out in the West during the labor-abundant high Middle Ages - was reintroduced in the land-abundant conditions of the New World.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="25" data-marpit-pagination-total="55" style="--paginate:true;--style:section {font-size: 26px;}
;--theme:gaia;">
<p>Why did Western Europe (and later Northern British American colonies) not maintain or institute serfdom?</p>
<p>It was not for lack of trying:</p>
<blockquote>
<p>On the other hand, of course, it has not always worked that way. England's peasants were not re-enserfed after the Black Death drove up their wages; attempts to build a system of indentured white servitude in America failed; slavery was abolished; and in the modern world wages do more or less reflect marginal productivity.</p>
</blockquote>
</section>

;--theme:gaia;">
<h2 id="domars-trilemma">Domar's Trilemma</h2>
<ul>
<li>
<p>An economy can have only TWO of the following three things at the same time:</p>
<ul>
<li>Free Land, Free Labor, a  Landlord Rentier class</li>
</ul>
</li>
<li>
<p>Possible combinations:</p>
<ul>
<li>
<p><strong>Free Land + Free Labor (no landlord class)</strong></p>
</li>
<li>
<p><strong>Free Land + Landlord Rentier class  (unfree labor)</strong></p>
<ul>
<li>landlords coerce labor/restrict mobility</li>
</ul>
</li>
<li>
<p><strong>Free Labor + Landlord class (all land enclosed)</strong></p>
<ul>
<li>Landlords restrict labor's access to land</li>
</ul>
</li>
</ul>
</li>
</ul>
<p><br /><br /><br />
Note: 'free land' need not literally free -- broadly means labor has access to land.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="28" data-marpit-pagination-total="55" style="--paginate:true;--style:section {font-size: 26px;}
;--theme:gaia;">
<h2 id="land-abundance-1">Land abundance 1</h2>
<h3 id="free-land--free-labor-no-landlord-rentier-class">Free Land + Free Labor  (no landlord rentier class)</h3>
<ul>
<li>Free land: Open frontier for squatting, homesteading, buying land (e.g. US North)</li>
<li>Free labor: No restrictions on labor mobility</li>
<li>Landlords cannot earn low land rents (no rentier class)
<ul>
<li>land rents low because land is so abundant</li>
<li>labor is expensive because labor is scarce (landlords would have to pay a wage equal to what labor can earn ny establishing their own farms)</li>
</ul>
</li>
</ul>
<p><strong>Examples:</strong></p>
<ul>
<li>West Europe after Black Death</li>
<li>Northern USA in early 19th C. Open frontier, family farming.</li>
<li>Free peasantries in Africa or Europe in different time periods</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="29" data-marpit-pagination-total="55" style="--paginate:true;--style:section {font-size: 26px;}
;--theme:gaia;">
<h2 id="land-abundance-2">Land abundance 2</h2>
<h3 id="free-land--landlord-class-labor-mobility-restricted">Free Land + Landlord Class (labor mobility restricted)</h3>
<ul>
<li>With abundant land and an open frontier, landlor rents would be low.</li>
<li>But landlords may coerce labor (serfdom, slavery) or act to severely restrict labor from access to land (e.g. Italian or Latin American latifundia, South African Land policies, etc)</li>
<li>Landlords then keep wages low and capture monopsony rents.</li>
</ul>
<p><strong>Examples:</strong>*</p>
<ul>
<li>American South and African slavery.</li>
<li>Serfdom in Russia.</li>
</ul>
<br />
Hence Free Land (frontier) may lead to either free labor or labor coercion.  Depends on relative politicall strength of landlords and laborers.
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="30" data-marpit-pagination-total="55" style="--paginate:true;--style:section {font-size: 26px;}
;--theme:gaia;">
<h3 id="free-labor--landlord-class-all-land-enclosed">Free Labor + Landlord class (all land enclosed)</h3>
<ul>
<li>As population density rises and frontier becomes 'closed' land becomes scarcer, enclosed and exclusively owned.  Can collect rents without restricting labor.</li>
<li>Those without access to land now 'freely' sell their labor.</li>
<li>Land concentration could be more or less egalitarian.</li>
</ul>
<p><strong>Examples:</strong>*</p>
<ul>
<li>English landlords after enclosures</li>
<li>The developed world today</li>
</ul>
<p>These examples differ in how unequal the distribution of land is.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="31" data-marpit-pagination-total="55" style="--paginate:true;--style:section {font-size: 26px;}
;--theme:gaia;">
<p>Even where outright slavery or sefdom are outlawed, dominant groups have attempted to limit labor's mobility as well as access to land.</p>
<p>Two extreme examples:</p>
<ul>
<li>post-bellum US South:
<ul>
<li>Black Codes enacted soon after Abolition, restricted property ownership and limited labor mobility.</li>
</ul>
</li>
<li>South Africa:
<ul>
<li>Natives Land Act of 1913 dismantled African peasantry (seizing lands and limiting tenancies) to create a low-wage labor reserve for mines and white owned farms.</li>
<li>Apartheid laws &gt; 1948 further established segregation and regulated labor mobility.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="32" data-marpit-pagination-total="55" style="--paginate:true;--style:section {font-size: 26px;}
;--theme:gaia;--marpit-advanced-background-split:40%;" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;attachments/gr_wakefield.jpg&quot;);background-size:450px auto;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="32" data-paginate="true" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="32" data-marpit-pagination-total="55" style="--paginate:true;--style:section {font-size: 26px;}
;--theme:gaia;--marpit-advanced-background-split:40%;" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="edward-gibbon-wakefield">Edward Gibbon Wakefield</h3>

<ul>
<li>Writing in early 19th century, after British abolition of slave trade.</li>
<li>Concerned that, absent coercion, colonization efforts in frontier colonies would be stymied by problem of maintaining 'constancy of labor' to large farms and other enterprises.</li>
<li>Proposed solution: limit immigrants access to land via minimum land price.</li>
<li>Shaped British settlement schemes in New Zealand and Australia.</li>
<li>In Capital Vol I, Marx points to Wakefield for inadvertently demonstrating why capitalist system cannot thrive where workers have access to land and other means of production.</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="32" data-marpit-pagination-total="55" style="" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="33" data-marpit-pagination-total="55" style="--paginate:true;--style:section {font-size: 26px;}
;--theme:gaia;">
<blockquote>
<p>“[If] all members of the society are supposed to possess equal portions of capital... no man would have a motive for accumulating more capital than he could use with his own hands. This is to some extent the case in new American settlements, where a passion for owning land prevents the existence of a class of labourers for hire.”</p>
</blockquote>
<ul>
<li>Wakefield 'Systematic Colonization' and Colonial Reform policy
<ul>
<li>Sold as a way to relieve unemployment in Britain (which though industrializing had fast growing population and at times deplorable working conditions and poverty/vagrancy) -- Remember Engel's Pause.</li>
<li>Government support for organized settlement and colonization schemes in Australia and New Zealand.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="34" data-marpit-pagination-total="55" style="--paginate:true;--style:section {font-size: 26px;}
;--theme:gaia;--marpit-advanced-background-split:50%;" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;attachments/cover_Foner.png&quot;);background-size:450px auto;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="34" data-paginate="true" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="34" data-marpit-pagination-total="55" style="--paginate:true;--style:section {font-size: 26px;}
;--theme:gaia;--marpit-advanced-background-split:50%;" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="why-no-slavery-in-the-north">Why no slavery in the North?</h3>

<ul>
<li>Grain crops based on family labor, history of settlement meant no tight-knit Virginia aristocracy.</li>
<li>By eve of civil war, Republican party created around ideas of <strong>Free Soil</strong> opposed the expansion of slavery into new territories and in favor of Federal lands cheaply to settlers.  Homestead Acts, 1862 and 1866. Settlers could claim up to 160 acres of public land.</li>
<li>The <strong>Free Labor</strong> ideology emphasized importance of free labor, as opposed to slave labor, as cornerstone of American democracy and economic opportunity.</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="34" data-marpit-pagination-total="55" style="" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="35" data-marpit-pagination-total="55" style="--paginate:true;--style:section {font-size: 26px;}
;--theme:gaia;">
<h3 id="why-slavery-in-the-south">Why Slavery in the South?</h3>
<ul>
<li>Bacon's Rebellion (1676) in Virginia:  armed rebellion of white indentured servants, landless former servants, and African slaves against the colonial government and its perceived favoritism for wealthy planters. Rebels also wanted more frontier expansion (which created conflict with Native Americans).</li>
<li>Colonial response led to shift away from indentured servants to African slave labor, seen as more easily controlled. Development of strict racial hierarchies and plantation system.</li>
<li>Several plantation Crops pith some economies of scale, easier to introduce chain gang and plantation.</li>
<li></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="36" data-marpit-pagination-total="55" style="--paginate:true;--style:section {font-size: 26px;}
;--theme:gaia;--marpit-advanced-background-split:50%;" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;attachments/slave_work.jpg&quot;);background-size:450px auto;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="36" data-paginate="true" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="36" data-marpit-pagination-total="55" style="--paginate:true;--style:section {font-size: 26px;}
;--theme:gaia;--marpit-advanced-background-split:50%;" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h2 id="did-slavery-profits-lead-to-industrial-revolution">Did Slavery Profits lead to Industrial Revolution?</h2>
<ul>
<li>Eric Williams (1944): sugar plantations in the West Indies supplied capital for British industry and calories for workers.</li>
<li>Counter-argument by Engerman and others: slave trade and plantation profits not large relative to the fast growing British economy.  Also, hard to prove capital flows.</li>
<li>A very recent empirical paper mounts an important counter-counter-argument...</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="36" data-marpit-pagination-total="55" style="" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="37" data-marpit-pagination-total="55" style="--paginate:true;--style:section {font-size: 26px;}
;--theme:gaia;--marpit-advanced-background-split:50%;" data-marpit-advanced-background="background" data-marpit-advanced-background-split="left"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;attachments/gr_slavery_IR_cover.png&quot;);background-size:600px auto;"></figure></div></section></foreignObject><foreignObject width="50%" height="720" x="50%"><section id="37" data-paginate="true" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="37" data-marpit-pagination-total="55" style="--paginate:true;--style:section {font-size: 26px;}
;--theme:gaia;--marpit-advanced-background-split:50%;" data-marpit-advanced-background="content" data-marpit-advanced-background-split="left">
<p><strong>Important Recent paper:</strong></p>
<blockquote>
<p>Heblich, S., Redding, S.J., Voth, H.-J., 2022. <a href="https://doi.org/10.3386/w30451">Slavery and the British Industrial Revolution</a>. WP.</p>
</blockquote>
<ul>
<li><a href="https://cepr.org/voxeu/columns/slavery-and-british-industrial-revolution">Shorter blog summary</a></li>
<li><a href="https://cepr.org/multimedia/slavery-and-industrial-revolution">VoxTalks podcast interviews authors</a></li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="37" data-marpit-pagination-total="55" style="" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="left"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="38" data-marpit-pagination-total="55" style="--paginate:true;--style:section {font-size: 26px;}
;--theme:gaia;">
<h3 id="slavery-and-the-industrial-revolution-research-design">Slavery and the Industrial Revolution: Research Design</h3>
<ul>
<li>Parliament compensated slave owners for 'loss of property' in 1833.</li>
<li>Database of 25K compensated. £20 million (~£108 bn today)
<ul>
<li>Shows slavers residence in Britain, slaves owned, etc.</li>
<li>Can trace family wealth accumulation in areas of Britain.</li>
</ul>
</li>
<li>Empirical challenges:
<ul>
<li>perhaps wealthy enter slave trade (so not causal)</li>
<li>how measure accumulation primarily due to slave trade?</li>
<li>No regional GDP data for Britain before 1830s.</li>
</ul>
</li>
<li>Empirical strategies:
<ul>
<li>Trace family histories to capture accumulation due to slave trade + holding.</li>
<li>Use predicted ('instrumented') wealth to capture how shifts in accumulation affect outcomes.  Instrument: weather and slave voyage losses.</li>

<h3 id="slavery-and-the-industrial-revolution-results">Slavery and the Industrial Revolution: Results</h3>
<ul>
<li>
<p>Slavery increased Britain aggregate GDP at least 3.5 percent (a decade of growth)</p>
</li>
<li>
<p>Shaped the geography of industrialization</p>
<ul>
<li>Locations w/ heaviest slave investments 40% higher GDP.</li>
<li>More structural transformation. Helps explain rise of North of England &gt;1750.</li>
<li>Could this have been determining?  Might the IR have stalled, might population growth returned to Malthusian era?  Remember Engel's pause.</li>
</ul>
</li>
<li>
<p>Why not similar effect in Spain/Portugal?</p>
<ul>
<li>Institutions/seeds for IR.</li>
</ul>
</li>
<li>
<p>Conclusion:</p>
<ul>
<li>&quot;Slavery wealth accelerated Britain's industrial revolution.&quot;<br />
Possibly in a determining way.</li>
</ul>
</li>
</ul>

<h2 id="abolition-and-the-labor-systems-that-followed">Abolition and the labor systems that followed</h2>

<ul>
<li>British abolished slave trade 1807, slavery itself in 1834.</li>
<li>Slavery abolished USA 1863, Serfdom in Russia 1861, Brazil 1888.</li>
<li>Was slavery abolished for economic reasons or moral reasons?</li>
<li>Fogel+Engerman (1974) and others showed American slavery economically profitable on eve of civil war. Drescher: primarily moral and political reasons.</li>
<li>Political economists argued free labor was more efficient.</li>
</ul>

<h2 id="the-dismal-science">The &quot;Dismal Science&quot;</h2>
<ul>
<li>
<p>Since slavery was a large and profitable industry, abolitionists often appealed to work of classical economists (Smith, Ricardo, Mill) to argue that free labor would lead to more efficient allocations.</p>
</li>
<li>
<p>Thomas Carlyle (Scottish historian) criticized market economic theories of classical economists (Smith, Ricardo, Mill). Labeled economics the &quot;dismal science&quot; for advocating emancipation and imaginging a society ruled by markets and individuals primarily motivated by self-interest. Saw this as undermining social order and paternalistic hiearchical relationships (built upon racist categories) which he argued offered a more 'optimistic' future.</p>
</li>
<li>
<p><a href="https://www.theatlantic.com/business/archive/2013/12/why-economics-is-really-called-the-dismal-science/282454/">Why Economics Is Really Called 'the Dismal Science'</a>, <em>The Atlantic</em></p>
</li>
</ul>
