<h2 id="labor-and-technology">Labor and Technology</h2>
<ul>
<li>
<p>A central question that connects the many 'transitions' we've studied: How does technological/institutional come about and does it displace workers, or generate new employment?</p>
</li>
<li>
<p>Acemoglu and Restrepo's framework helps connect these historical cases to modern automation and AI debate.</p>
<blockquote>
<p>Atack, Jeremy, Robert A. Margo, and Paul W. Rhode. 2019. “‘Automation’ of Manufacturing in the Late Nineteenth Century: The Hand and Machine Labor Study.” <em>Journal of Economic Perspectives</em> 33 (2): 51–70. <a href="attachments/automation/atack.pdf">PDF</a></p>
</blockquote>
<blockquote>
<p>Acemoglu, Daron, and Pascual Restrepo. 2019. “Automation and New Tasks: How Technology Displaces and Reinstates Labor.” <em>Journal of Economic Perspectives</em> 33 (2): 3–30. <a href="https://drive.google.com/file/d/1EN2vgjUJGaRaKScuriX6N8FCxzVkA5tQ/view?usp=sharing">PDF (optional)</a></p>
</blockquote>
</li>
</ul>

<h2 id="the-direction-of-technological-change">The Direction of Technological Change</h2>
<ul>
<li>Tech change is not a neutral, inevitable force.</li>
<li>The <em>direction</em> of innovation—whether it saves labor or creates new industries—is shaped by incentives.</li>
<li>Determinants include:
<ul>
<li><strong>Factor Endowments:</strong> The relative scarcity and cost of land, labor, and capital.</li>
<li><strong>Market Environment:</strong> Scale and elasticity of demand.</li>
<li><strong>Institutions:</strong> Property rights, tax policy, labor laws, bargaining power of labor and capital.</li>
</ul>
</li>
</ul>

<h2 id="the-ar-task-based-model-of-production">The AR Task-Based Model of Production</h2>
<ul>
<li>

</li>
<li>
<p>Acemoglu &amp; Restrepo instead model production as a <strong>continuum of discrete tasks</strong>. Capital and labor are substitutes in any given task.</p>
</li>
<li>
<p><strong>Automation</strong> occurs when capital replaces labor in a given task.</p>

<h3 id="technological-change-creates-competing-forces">Technological change creates competing forces:</h3>
<ol>
<li><strong>Displacement Effect:</strong> Automation pushes labor out of specific tasks, reducing the labor share of value and placing downward pressure on wages.</li>
<li><strong>Productivity Effect:</strong> Machines lower production costs, leading to lower prices and increased overall output. This raises demand for labor in non-automated tasks.</li>
<li><strong>Reinstatement Effect:</strong> Technological change can also create <strong>new tasks</strong> where humans hold a comparative advantage, pulling labor back into production.</li>
</ol>

<h4 id="the-luddites">The Luddites</h4>
<ul>
<li>The Luddites (1811–1816): 19th-century English textile workers, primarily based in Nottingham, protested against labor-replacing machinery and the erosion of their wages and rights.</li>
<li>For centuries hand-woven stockings had been made by skilled weavers working in their homes. New factories with powered looms could produce stockings more quickly and cheaply, threatening the livelihoods of the handloom weavers.</li>
<li>Some stocking frames destroyed, but more typically threatened as bargaining tactic. Blamed mythical &quot;Ned Ludd&quot;, who first smashed a stocking frame in 1779.</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-style="section {font-size: 27px;}

<h2 id="state-intervention-and-labors-bargaining-power">State Intervention and Labor's Bargaining Power</h2>
<ul>
<li>The British state supported capital owners and suppressed labor organization.</li>
<li><strong>The Combination Acts (1799/1800)</strong> criminalized trade unionism and collective bargaining.</li>
<li><strong>The Frame Breaking Act (1812)</strong> made destruction of mechanized looms a capital crime. In 1813, 17 Luddites were executed. Many more to penal colonies.</li>
<li><strong>The Result:</strong> With labor legally restrained and a growing supply of displaced rural workers, capital captured the productivity gains. Part of reason why wages stagnated for decades (&quot;Engels' Pause&quot;).</li>
</ul>
</section>

<h3 id="swing-riots">Swing Riots</h3>
<ul>
<li>Impoverished agricultural laborers in rural England. During Napoleonic Wars, prices for food had risen. Enclosures had pushed many off lands. Rioters protested low wages, the unfair tithe system, the draconian Poor Laws, and the introduction of labor-saving horse-drawn threshing machines in 1830-31.</li>
<li>Smashed threshing machines and tithe barns.</li>
<li>2000 people put on trial.  292 sentenced to death (19 ultimately hanged).</li>
</ul>

<h2 id="automation-of-manufacturing-us-1899">Automation of Manufacturing (US, 1899)</h2>
<ul>
<li>Using the AR frameowrk, and to observe task shifts at the micro-level, <em>Atack, Margo, and Rhode (2019)</em> use the 1899 &quot;Hand and Machine Labor&quot; study.</li>
<li>Study documented production methods before and after factory mechanization in the United States.</li>
<li>Focused strictly on the <strong>task level</strong>: what specifically does a worker do, and how long does it take?</li>
<li>A primary example: Making 100 pairs of medium-grade shoes.</li>
</ul>
</section>

<h3 id="the-shift-to-specialization">The Shift to Specialization</h3>
<ul>
<li><strong>Hand production</strong>: artisan performed most tasks involved in making a shoe.</li>
<li>Median number of tasks per worker was 2 (higher for masters).</li>
<li><strong>Machine production</strong>: median tasks per worker fell to <strong>1</strong>.</li>
<li>Workers became highly specialized, allowing steam-powered machines to take over routine physical steps.</li>
</ul>
</section>

<h3 id="task-transitions-and-reinstatement">Task Transitions and Reinstatement</h3>
<ul>
<li>Mechanization subdivided complex tasks and consolidated others.</li>
<li>Crucially, it also generated <strong>new tasks</strong> (The Reinstatement Effect).</li>
<li>Approximately 1/3 of the tasks in machine production were new to the process.</li>
<li>Examples: maintaining steam engines, quality inspection, specialized foreman supervision.</li>
</ul>

<h3 id="american-divergence-north-vs-south">American Divergence: North vs. South</h3>
<ul>
<li><strong>The Free North (Habakkuk Thesis):</strong> Open frontier made free labor scarce and expensive. <em>Induced innovation</em> specifically labor-saving (e.g., the McCormick reaper, interchangeable parts).</li>
<li><strong>The Coerced South:</strong> Violent coercion artificially suppressed labor. Southern landowners had little incentive to adopt labor-saving technology. Region lagged in industrialization.</li>
<li><strong>Deliberate Underdevelopment:</strong> Gavin Wright argues that post-bellum landowners blocked higher-wage industrial competitors from entering the region and underfunded public schooling to keep the local populace dependent on agriculture.</li>
</ul>
</section>

<h3 id="east-asian-miracles-induced-innovation">East Asian Miracles: Induced Innovation</h3>
<ul>
<li>Economies like Japan, South Korea, and Taiwan experienced different technological trajectories, supported by early, widespread land reform.</li>
<li><strong>Induced Innovation:</strong> Rather than importing large, labor-displacing Western factories wholesale, they adapted technology to their specific factor endowments (scarce land, abundant labor).</li>
<li>They reverse-engineered Western designs to create smaller, appropriate machinery that could be utilized within extensive subcontracting networks.</li>
</ul>
</section>

<h2 id="expanding-the-task-frontier">Expanding the Task Frontier</h2>
<ul>
<li>By adapting technology in this way, these economies generated a substantial <strong>Reinstatement Effect</strong>, expanding labor-intensive tasks in light manufacturing.</li>
<li><strong>Human Capital:</strong> State investments in education ensured the workforce could adapt to these new, increasingly complex tasks.</li>
<li><strong>Export Orientation:</strong> Competing in global markets provided highly elastic demand.</li>
<li><strong>The Result:</strong> A strong Productivity Effect. Output scaled rapidly, allowing labor demand to keep pace with displacement and driving sustained wage growth.</li>
</ul>

<h3 id="a-structural-shift-1987%E2%80%932017">A Structural Shift (1987–2017)</h3>
<ul>
<li><strong>Displacement</strong> has continued, driven by software, algorithms, and robotics.</li>
<li><strong>Reinstatement Effect</strong> has slowed significantly.</li>
<li>AR attribute this to rise of &quot;so-so&quot; technologies: innovations that are just efficient enough to replace human labor but fail to generate the large productivity gains needed to boost broader labor demand.</li>
</ul>

<h2 id="the-so-so-technology-trap">The &quot;So-So&quot; Technology Trap</h2>
<ul>
<li><strong>Definition:</strong> Innovations that are just efficient enough to be adopted but fail to generate the large productivity gains needed to boost broader labor demand.</li>
<li><strong>The Mechanism:</strong> High <strong>Displacement</strong> (jobs lost) but very low <strong>Productivity Effect</strong> (no price drops or new demand).</li>
<li><strong>Examples:</strong> Automated grocery checkouts, automated customer service phone trees.</li>
<li><strong>Result:</strong> Labor loses its share of production without the &quot;pie&quot; growing large enough to create replacement roles.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-style="section {font-size: 27px;}

<h2 id="why-reinstatement-has-slowed">Why Reinstatement has Slowed</h2>
<ul>
<li><strong>Human Capital Mismatch:</strong> Reinstatement requires workers with skills for <em>new</em> tasks. If the education system lags behind the frontier, firms cannot man new tasks even if they are technically possible.</li>
<li><strong>Intellectual Bias:</strong> AR argue current AI research (OpenAI, Google) is biased toward <strong>Human-Mimicry</strong> (getting machines to do what humans already do) rather than <strong>Human-Complementarity</strong> (creating tools that let humans do new things).</li>
<li><strong>Market Power:</strong> Large tech platforms may focus on &quot;remote automation&quot; (offshoring) and data-capture models that scale without adding domestic headcount.</li>
</ul>
</section>
