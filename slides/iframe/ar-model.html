<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acemoglu & Restrepo Task Model</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 10px;
            background-color: #f9fafb;
            color: #333;
            margin: 0;
            overflow: hidden;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #111827;
            font-size: 1.4em;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group label {
            font-weight: bold;
            margin-bottom: 2px;
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
        }

        .control-group small {
            font-size: 0.75em;
            color: #6b7280;
        }

        input[type=range] {
            width: 100%;
            cursor: pointer;
            margin: 4px 0;
        }

        /* Compacted Visualization Area */
        .viz-container {
            border: 1px solid #d1d5db;
            padding: 10px 10px 0 10px;
            border-radius: 6px;
            background: #ffffff;
            height: 105px;
            display: flex;
            align-items: flex-end;
        }

        .task-continuum {
            display: flex;
            width: 100%;
            height: 100%;
            align-items: flex-end;
            background: repeating-linear-gradient(45deg, #f3f4f6, #f3f4f6 10px, #ffffff 10px, #ffffff 20px);
            border-bottom: 2px solid #9ca3af;
        }

        .capital-bar {
            background-color: #3b82f6;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.85em;
            transition: all 0.2s ease-out;
            box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.2);
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid #1e3a8a;
            width: 25%;
            flex: 0 0 25%;
            height: 40px;
        }

        .labor-bar {
            background-color: #10b981;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.85em;
            transition: all 0.2s ease-out;
            box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.2);
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid #064e3b;
            width: 25%;
            flex: 0 0 25%;
            height: 40px;
        }

        .metrics {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e5e7eb;
            font-size: 0.85em;
        }

        .metric-box {
            flex: 1;
            text-align: center;
        }

        .metric-value {
            font-size: 1.4em;
            font-weight: bold;
            display: block;
            margin-top: 2px;
        }

        .text-blue {
            color: #3b82f6;
        }

        .text-green {
            color: #10b981;
        }

        .text-dark {
            color: #1f2937;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>The Race Between Man and Machine</h2>

        <div class="controls">
            <div class="control-group">
                <label>Automation Threshold (I) <span id="i-val" class="text-blue">50 Tasks</span></label>
                <input type="range" id="slider-i" min="10" max="190" value="50">
                <small>Moves the boundary right, displacing labor.</small>
            </div>
            <div class="control-group">
                <label>New Tasks (N) <span id="n-val" class="text-green">100 Tasks</span></label>
                <input type="range" id="slider-n" min="50" max="200" value="100">
                <small>Expands the frontier right, reinstating labor.</small>
            </div>
            <div class="control-group">
                <label>Capital Productivity (A^K) <span id="ak-val" class="text-blue">1.0x</span></label>
                <input type="range" id="slider-ak" min="1" max="2.5" step="0.1" value="1">
                <small>Makes existing machines more efficient (Intensive margin).</small>
            </div>
        </div>

        <div class="viz-container">
            <div class="task-continuum" id="continuum">
                <div class="capital-bar" id="capital-bar">Capital</div>
                <div class="labor-bar" id="labor-bar">Labor</div>
            </div>
        </div>

        <div class="metrics">
            <div class="metric-box">
                Labor Task Share (Γ)
                <span class="metric-value text-green" id="metric-gamma">0.50</span>
            </div>
            <div class="metric-box">
                Total Output (Y)
                <span class="metric-value text-dark" id="metric-output">100</span>
            </div>
            <div class="metric-box">
                Wage Bill (Γ × Y)
                <span class="metric-value text-green" id="metric-wagebill">50</span>
            </div>
        </div>
    </div>

    <script>
        function initARModel() {
            const sliderI = document.getElementById('slider-i');
            const sliderN = document.getElementById('slider-n');
            const sliderAK = document.getElementById('slider-ak');

            if (!sliderI || !sliderN || !sliderAK) {
                setTimeout(initARModel, 50);
                return;
            }

            const capitalBar = document.getElementById('capital-bar');
            const laborBar = document.getElementById('labor-bar');

            const valI = document.getElementById('i-val');
            const valN = document.getElementById('n-val');
            const valAK = document.getElementById('ak-val');

            const metricGamma = document.getElementById('metric-gamma');
            const metricOutput = document.getElementById('metric-output');
            const metricWageBill = document.getElementById('metric-wagebill');

            const MAX_N = 200;

            function updateViz() {
                let I = parseFloat(sliderI.value);
                let N = parseFloat(sliderN.value);
                const AK = parseFloat(sliderAK.value);

                if (I >= N) {
                    I = N - 1;
                    sliderI.value = I;
                }
                if (N <= I) {
                    N = I + 1;
                    sliderN.value = N;
                }

                const capPct = (I / MAX_N) * 100;
                const labPct = ((N - I) / MAX_N) * 100;

                capitalBar.style.flex = `0 0 ${capPct}%`;
                laborBar.style.flex = `0 0 ${labPct}%`;

                const baseHeight = 40;
                capitalBar.style.height = (baseHeight * AK) + 'px';
                laborBar.style.height = baseHeight + 'px';

                valI.innerText = I + ' Tasks';
                valN.innerText = N + ' Tasks';
                valAK.innerText = AK.toFixed(1) + 'x';

                const gamma = (N - I) / N;
                metricGamma.innerText = gamma.toFixed(2);

                const output = (I * AK) + (N - I);
                metricOutput.innerText = Math.round(output);

                // Calculate and display Wage Bill
                const wageBill = gamma * output;
                metricWageBill.innerText = Math.round(wageBill);
            }

            sliderI.addEventListener('input', updateViz);
            sliderN.addEventListener('input', updateViz);
            sliderAK.addEventListener('input', updateViz);

            updateViz();
        }

        initARModel();
    </script>
</body>

</html>
