<li>OG 7 &quot;Splendour and Misery&quot; 127-142.</li>
<li>OG 8 &quot;The Fingerprints of Institutions&quot;</li>
</ul>
<h3 id="readings-1">Readings</h3>

<li>KR &quot;Is it all just Institutions?&quot;</li>

;">
<h3 id="fundamental-deeper-versus-proximate-causes">Fundamental (&quot;Deeper&quot;) versus Proximate Causes</h3>
<ul>
<li>Your neighbor's lawn is greener than yours. Why?</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-fragments="6" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="6" data-marpit-pagination-total="63" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;">
<h3 id="institutions">Institutions</h3>
<p>Douglas North, Nobel</p>
<ul>
<li data-marpit-fragment="1">Institutions are 'the rules of the game'</li>
<li data-marpit-fragment="2">&quot;Humanly devised constraints that shape human interaction&quot;.</li>
<li data-marpit-fragment="3">Formal or Informal</li>
<li data-marpit-fragment="4">Reduce uncertainty by providing structure to our daily lives.</li>
<li data-marpit-fragment="5">Allow us to make commitments and trust others
<ul>
<li data-marpit-fragment="6">incentives to invest, innovate, improve allocations, and trade.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="7" data-marpit-pagination-total="63" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;">
<h3 id="a-side-note-on-the-history-of-ideas">A side note on the History of Ideas</h3>
<h2 id="some-political-economy-labels">Some Political Economy labels:</h2>
<ul>
<li>Autocratic Rule
<ul>
<li>Divine right of Kings. Aristocracy</li>
<li>Hierarchies, privilege and vertical control.</li>
</ul>
</li>
<li><strong>Mercantilists</strong>:
<ul>
<li>Economic nationalism:  Accumulating wealth and power via monopolies on trade and colonies. Tends to see economy in zero-sum terms (your loss, my gain).</li>
<li>Government intervention: Taxes, tariffs, regulations, licenses, offices for sale. Rent extraction.</li>
</ul>
</li>
<li>Cultivation of virtue seen as the foundation of good government.
<ul>
<li>Good obedient religious citizens and virtuous leaders who internalize moral values.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="8" data-marpit-pagination-total="63" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;">
<h3 id="emerging-challenges">Emerging challenges</h3>
<p>• Experience of centuries of war (e.g. 30 years war 1618-1648) and dogma.<br />
Kings vs parliaments.</p>
<p>• Rising challenges to absolutism, aristocracy<br />
and arbitrary power.</p>
<p>• Protestant reformation, spread of literacy, printing press.</p>
<p>• Age of discovery, new settlements, ideas from trade and colonialism</p>
<p>• Scientific revolution.</p>
<p>• Commercialization, urbanization and rise of middle class.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-marpit-fragments="7" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="9" data-marpit-pagination-total="63" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;">
<h2 id="classical-liberals">Classical Liberals</h2>
<ul>
<li data-marpit-fragment="1">John Locke, David Hume, Adam Smith, Wilhelm von Humboldt, Thomas Jefferson, Jean-Batiste Say, Frederich Hayek, Ludwig von Mises ...
<ul>
<li data-marpit-fragment="2">Individualism.  Natural rights (life, liberty, property)</li>
<li data-marpit-fragment="3">Empiricism: skepticism, reason over dogma.</li>
<li data-marpit-fragment="4">Self interest as motivator. Spontaneious order.<br />
Can lead to good societal outcomes.</li>
<li data-marpit-fragment="5">Limited Government. Rule with legitimacy/consent of the governed.
<ul>
<li data-marpit-fragment="6">Rule of Law</li>
<li data-marpit-fragment="7">Free Markets. State role subsidiary, support markets.</li>
</ul>
</li>
</ul>
</li>
</ul>
<ul>
<li>Mechanism design:  Constitutions, Separation of powers, Rule of Law.  To harness and direct self-interest.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-marpit-fragments="5" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="10" data-marpit-pagination-total="63" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;">
<h2 id="political-economy-labels-continued">Political Economy labels (continued):</h2>
<ul>
<li data-marpit-fragment="1"><strong>Marx:</strong> Rising bourgeoisie class throws out the old, dispossess the poor to make 'free' wage labor/proletariat.</li>
<li data-marpit-fragment="2">The Social Relations of Production (Institutions, property rights) established by rising class to their advantage.</li>
<li data-marpit-fragment="3">Capitalist revolution challenges feudal order but also dispossesses peasantry to jump start wage-labor and market imperative. Markets transform the world but with periodic crises and only the few get rich.</li>
<li data-marpit-fragment="4">Marx is labeled a Classical Political economist (builds on Ricardo and classical tools). But not a Liberal.</li>
<li data-marpit-fragment="5">Many Marxian interpretations and elaborations.</li>
</ul>
<p><br /><br /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-marpit-fragments="1" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="11" data-marpit-pagination-total="63" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;">
<h2 id="how-economics-emerged-and-pushed-institutions-to-the-background">How economics emerged and pushed institutions to the background:</h2>
<p>Twentieth century:</p>
<ul>
<li data-marpit-fragment="1"><strong>Neo-classical:</strong> Like the classicals, but with marginalism and math and less institutional detail.
<ul>
<li>
<p>Firms as black boxes at arms length from consumers</p>
</li>
<li>
<p>everyone a price-taker on perfectly competitive market</p>
</li>
<li>
<p>secure property rights assumed to be costlessly enforced by third party.</p>
</li>
<li>
<p>Invisible hand results:  free markets+competition --&gt; efficiency.</p>
<blockquote>
<p>An economic transaction is a solved political problem ... Economics has gained the title Queen of the Social Sciences by choosing solved political problems as its domain (Abba Lerner, 1972).</p>
</blockquote>
</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-marpit-fragments="10" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="12" data-marpit-pagination-total="63" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;">
<h2 id="political-economy-labels-continued-1">Political Economy labels (continued):</h2>
<ul>
<li data-marpit-fragment="1"><strong>Hamiltionian / Keynesian / Development Planning:</strong>  Markets are good, but market failures are very real.  Government needed to create and repair markets, confer legitimacy and stability.</li>
<li data-marpit-fragment="2"><strong>Neo-classical synthesis</strong>: post-war fusion of Keynesian and Neo-classical ideas. Dominant academic and policy paradigm for 50 years.
<ul>
<li data-marpit-fragment="3">Bretton Woods Institutions: UN, World Bank, IMF, WTO.</li>
<li data-marpit-fragment="4">Sovereignty. Globalization.</li>
</ul>
</li>
<li data-marpit-fragment="5"><em><strong>Neo-liberals</strong></em> (a political more than an academic label.)
<ul>
<li data-marpit-fragment="6">Return to Classical liberal ideas: Hayek, Friedman, Mises.</li>
<li data-marpit-fragment="7">Thatcher, Reagan, Southern Cone authoritarianism.</li>
<li data-marpit-fragment="8">'Washington policy Consensus' advocated by IMF, World Bank, in early 1990s.</li>
<li data-marpit-fragment="9">Social Democratic variations (Clinton, Obama)</li>
</ul>
</li>
<li data-marpit-fragment="10">Today:  Resurgent mercantilism and Economic Nationalism.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="13" data-marpit-pagination-total="63" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;">
<h2 id="neo-classical-growth--development-model">Neo-classical Growth &amp; Development Model</h2>
<ul>
<li>
<p>The mainstream market-based growth and development model/narrative.</p>
</li>
<li>
<p>Differences in per-capita incomes are due to differences in technology and <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="4.683ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 2070 1000"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D43E" d="M285 628Q285 635 228 637Q205 637 198 638T191 647Q191 649 193 661Q199 681 203 682Q205 683 214 683H219Q260 681 355 681Q389 681 418 681T463 682T483 682Q500 682 500 674Q500 669 497 660Q496 658 496 654T495 648T493 644T490 641T486 639T479 638T470 637T456 637Q416 636 405 634T387 623L306 305Q307 305 490 449T678 597Q692 611 692 620Q692 635 667 637Q651 637 651 648Q651 650 654 662T659 677Q662 682 676 682Q680 682 711 681T791 680Q814 680 839 681T869 682Q889 682 889 672Q889 650 881 642Q878 637 862 637Q787 632 726 586Q710 576 656 534T556 455L509 418L518 396Q527 374 546 329T581 244Q656 67 661 61Q663 59 666 57Q680 47 717 46H738Q744 38 744 37T741 19Q737 6 731 0H720Q680 3 625 3Q503 3 488 0H478Q472 6 472 9T474 27Q478 40 480 43T491 46H494Q544 46 544 71Q544 75 517 141T485 216L427 354L359 301L291 248L268 155Q245 63 245 58Q245 51 253 49T303 46H334Q340 37 340 35Q340 19 333 5Q328 0 317 0Q314 0 280 1T180 2Q118 2 85 2T49 1Q31 1 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q147 65 216 339T285 628Z"></path></g><g data-mml-node="TeXAtom" data-mjx-texclass="ORD" transform="translate(889,0)"><g data-mml-node="mo"><path data-c="2F" d="M423 750Q432 750 438 744T444 730Q444 725 271 248T92 -240Q85 -250 75 -250Q68 -250 62 -245T56 -231Q56 -221 230 257T407 740Q411 750 423 750Z"></path></g></g><g data-mml-node="mi" transform="translate(1389,0)"><path data-c="1D43F" d="M228 637Q194 637 192 641Q191 643 191 649Q191 673 202 682Q204 683 217 683Q271 680 344 680Q485 680 506 683H518Q524 677 524 674T522 656Q517 641 513 637H475Q406 636 394 628Q387 624 380 600T313 336Q297 </li>
<li>
<p>Main barrier are 'bad policies' that distort markets and slow growth.<br />
Blame on rent-seeking bureaucrats and 'special interests.'</p>
</li>
<li>
<p>Prominent economic historians worked withing this framework.  History driven by swings in relative prices, population, resources (epidemics, expansion of frontiers and trade, etc). Institutions secondary and adaptive.</p>
</li>
<li>
<p>Market-driven 'Neo-Liberal' reforms following debt-crises of 80s and Soviet collapse/transition of 90s.  Liberalize trade, privatize and de-regulate business, open up capital markets, reduce the role of the state, etc.</p>
</li>
<li>
<p>Academia typically more heterodox, but economic orthodoxy ascendant in policy circles.</p>
</li>

<h2 id="new-growth-theory-1990s-2000s">New Growth Theory (1990s-2000s)</h2>
<ul>
<li>Focus on increasing returns to scale (IRS)
<ul>
<li>Knowledge and technology spillovers</li>
<li>Trying to 'endogenize' (explain) TFP growth.</li>
</ul>
</li>
<li>Models imply constant or increasing returns to factor accumulation, rather than standard neo-classical diminishing returns to capital or human capital<br />
(e.g. productivity of new engineer higher where there are more engineers).</li>
<li>Implies agglomeration and <em>divergence</em> of incomes.</li>
</ul>
<p><br /><br /><br />
But like the neo-classical growth models, these remain mechanical and abstract models, driven by the shape of technology. Institutions (markets, property rights protections) are <em>assumed</em> rather than explained.</p>
</section>

<h3 id="cross-country-regressions">Cross country regressions</h3>

<li>'Credibility Revolution in Economics' made people very wary of cross-country regressions, unless has clear causal identification strategy (i.e. can convincingly argue that right hand-side variables are not endogenous).</li>
</ul>

<h3 id="neo-institutional-critiques">Neo-institutional critiques</h3>
<ul>
<li data-marpit-fragment="1">
<p><strong>Ronald Coase:</strong> What is a firm?  Where does a firm stop and the market begin? Firms exist to minimize transactions costs. Economic performance is a function of the institutions that minimize transactions costs.</p>
</li>
<li data-marpit-fragment="2">
<p><strong>Douglass North:</strong> capital accumulation and innovation are only proximate causes of growth. They are manifestations of growth.  What are the deeper causes growth? Institutions, property rights, and the rule of law, shape incentives and the ability to accumulate capital and innovate.</p>
</li>
<li data-marpit-fragment="3">
<p>But how do institutions come about and change?</p>
<ul>
<li data-marpit-fragment="4">These authors, at least initially, tended to emphasize evolutionary adaptation.  Institutions evolve over time to minimize transactions costs in a changing environment.</li>
</ul>
</li>
</ul>
</section>

<h3 id="the-later-north">The Later North</h3>

<li data-marpit-fragment="1">In earlier work, North argued that Institutions tend to evolve to minimize transactions costs. Societies with more efficient institutions would grow faster, better institutions would spread.</li>
<li data-marpit-fragment="2">North came to elaborate his theory of institutional change to allow for the fact that institutions are shapedto the benefit of elites and the powerful and that this meant that inefficient or dysfunctional institutions could persist for a long time.</li>

<ul>
<li>Renewed interest in economic history and political economy.</li>

<li>Acemoglu and Robinson (2000) &quot;Colonial Origins of Comparative Development.&quot;</li>
<li>Many other papers cited in KR chapter.</li>
<li>Build on earlier neo-institutional economists
<ul>
<li>more theoretically elaborate and empirical.</li>
<li>Natural experiments and historical case studies over regressions.</li>
</ul>
</li>
</ul>

<h3 id="history-lessons-institutions-factor-endowments-and-paths-of-development-in-the-new-world">History Lessons: Institutions, Factor Endowments, and Paths of Development in the New World</h3>
<h3 id="sokoloff--engerman-2000">Sokoloff &amp; Engerman (2000)</h3>
<ul>
<li>
<p><strong>Initial Puzzle</strong>: Countries like the U.S. and Canada ultimately became more economically successful than Latin America, but this wasn't obvious at the start</p>
<ul>
<li>In 1700: Mexico = British colonies (future U.S.) in per capita income</li>
<li>Caribbean colonies (Barbados, Cuba) were 50-67% wealthier than future U.S.</li>
<li>Haiti was possibly the world's richest society per capita in 1790</li>
</ul>
</li>
<li>
<p><strong>Traditional Explanation</strong>: British institutions vs. Spanish/Portuguese institutions</p>
<ul>
<li>But this doesn't explain variations within the same colonial heritage</li>
<li>Many British colonies (Caribbean) didn't succeed like U.S./Canada</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="28" data-marpit-pagination-total="63" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;">
<h3 id="factor-endowments-and-inequality-three-paths">Factor Endowments and Inequality. Three paths:</h3>
<ol>
<li>
<p><strong>Sugar/Slave Economies</strong> (Caribbean, Brazil)</p>
<ul>
<li>Large plantations, scale economies, extreme inequality</li>
<li>Elite control of wealth, human capital, political power</li>
</ul>
</li>
<li>
<p><strong>Spanish America</strong> (Mexico, Peru)</p>
<ul>
<li>Mineral resources + large native populations</li>
<li>Land grants, tribute systems, concentrated wealth</li>
<li>Restrictive immigration policies preserved elite status</li>
</ul>
</li>
<li>
<p><strong>North American Mainland</strong> (U.S., Canada)</p>
<ul>
<li>No large native populations for labor</li>
<li>Climate unsuited for plantation agriculture</li>
<li>More homogeneous population, less inequality</li>
<li>Broad distribution of land, wealth, human capital</li>
</ul>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="29" data-marpit-pagination-total="63" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;">
<h3 id="institutions-and-persistence-of-inequality">Institutions and Persistence of Inequality.</h3>
<ul>
<li>
<p><strong>Political Participation</strong>: U.S./Canada led in extending voting rights</p>
<ul>
<li>Latin America maintained wealth/literacy requirements longer</li>
<li>Lower voting rates persisted through 1940</li>
</ul>
</li>
<li>
<p><strong>Public Education</strong>: U.S./Canada invested earlier and more extensively</p>
<ul>
<li>Strong local support for schools from settlement</li>
<li>Latin America delayed public education investments</li>
<li>Literacy rates followed the same pattern</li>
</ul>
</li>
<li>
<p>Institution development perpetuated initial inequality patterns</p>
<ul>
<li>Elites created rules that protected their advantages</li>
<li>Inequality persisted through policies on land, credit, voting, education</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-fragments="8" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}

<h3 id="marx-on-institutions">Marx on Institutions</h3>
<ul>
<li><strong>Social Relations of Production</strong>  -- Institutions</li>
<li><strong>Material Productive Forces</strong> -- physical resources and technology</li>
<li><strong>Mode of Production</strong> -- e.g. Feudalism, Capitalism</li>
</ul>
<p>As productive forces develop, new classes may see possibilities for new ways of organizing production to their benefit. Existing relations of production -- property rights and institutions -- may become obstacles and are challenged and replaced. There will be winners and losers as institutions are changed.</p>
<p>Social relations shaped/transformed by <strong>class conflict</strong>.</p>
</section>

<h3 id="marxian-vs-marxist">Marxian vs. Marxist</h3>
<ul>
<li>
<p>Marx and Marxian analysis vs. Marxist revolutionary politics and regimes.</p>
</li>
<li>
<p>What do neo-institutionalists, and Marxians have in commmon?</p>
<ul>
<li>Materialist conception of history</li>
<li>Institutions matter</li>
<li>Institutions are shaped by evolutionary proceseses and conflict.</li>
</ul>
</li>
<li>
<p>Many of the most interesting institutional analyses and debates in economic history are debates amongst Marxian or between Marxian and non-Marxian historians.</p>
<ul>
<li>What led to the transition to capitalism in Europe?<br />
e.g. Dobb-Sweezy and Brenner debates.</li>
<li>political Marxists vs neo-Smithian... many flavors.</li>
</ul>
</li>
</ul>
<p>(though a lot of Marxian analysis can be tiresome, tedious, heavy handed or just plain bad ... e.g. endless debates about taxonomies, single-minded focus on exploitative relations, Soviet propaganda, etc).</p>
</section>

;">
<h2 id="economic-institutions">Economic Institutions</h2>
<ul>
<li data-marpit-fragment="1">Security &amp; flexibility of property rights</li>
<li data-marpit-fragment="2">Free entry (to ensure competitive markets)</li>
<li data-marpit-fragment="3">Ability to form business organizations</li>
<li data-marpit-fragment="4">Ability to quit and move jobs</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-marpit-fragments="5" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}

<h2 id="political-institutions">Political Institutions</h2>
<ul>
<li data-marpit-fragment="1">Political rights</li>
<li data-marpit-fragment="2">Constraints on the executive</li>
<li data-marpit-fragment="3">Democracy</li>
<li data-marpit-fragment="4">Free media</li>
<li data-marpit-fragment="5">Independent Judiciary</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}

;">
<h2 id="property-rights">Property Rights</h2>
<ul>
<li>Social institutions that define and delimit the range of privileges granted to individuals to specific assets, such as parcels of land or water.</li>
<li>Private ownership <em>may</em> involve a variety of rights:
<ul>
<li>right to appropriate stream of rents from us e and investments in the resource.</li>
<li>right to exclude others from access</li>
<li>right to rent, sell or otherwise trnsfer.</li>
</ul>
</li>
<li>PRs may be based on
<ul>
<li>formal arrangements (constitutional provisions, statures, judicial decisions).</li>
<li>informal conventions and customs.</li>
<li>enforced privately and/or with state/community support.</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}

;">
<h2 id="prs-shape-incentives">PRs shape incentives</h2>
<ul>
<li>By allocating decision-making authority
<ul>
<li>shape incentives to invest and improve resources</li>
<li>also define distribution of wealth and power in society</li>
</ul>
</li>
</ul>
<h3 id="prs-enforcement">PRs enforcement</h3>
<ul>
<li>PRs may be created/enforced both privately, by community and/or state.</li>
<li>Insecure PRs
<ul>
<li>often overlapping, contested.</li>
<li>limited (e.g. limitations on use, leasing, sale)</li>
</ul>
</li>
</ul>
</section>

<h2 id="north-and-thomas-1973">North and Thomas (1973)</h2>
<h2 id="france-and-spain">France and Spain:</h2>
<ul>
<li>absolutist monarchies, relied on granting and taxing local monopoly privileges.</li>
<li>feared adjusting property would undermine their political and economic base, even if such changes might offer broader gains.</li>
</ul>
<h2 id="england-and-the-netherlands">England and the Netherlands:</h2>
<ul>
<li>commercial interests were stronger (particularly after 1688 &quot;Glorious Revolution&quot;).</li>
<li>Property rights tended to be adopted that allowed for more fluid resource movements and respond to market opportunities.</li>
<li>Enclosures and market for private land.</li>
</ul>
<blockquote>
<p>&quot;the fact that growth has been more exceptional than stagnation or decline suggests that efficient property rights are unusual in history (North, 1981, p6)&quot;</p>
</blockquote>

<h2 id="the-glorious-revolution-of-1688-1">The Glorious Revolution of 1688</h2>
<ul>
<li>King James II of England was a Catholic and a proponent of absolute monarchy and the Divine Right of Kings.</li>
<li>Protestant William of Orange invades, overthrows (his father-in-law) James II in 1688, and is crowned.</li>
<li>English Bill of Rights, Toleration Act, Mutiny Act etc. <strong>credibly committed</strong> monarchs to accept constraints. Parliamentary oversight, authority to impose and collect taxes, impeach judges, etc.</li>
<li>It has been argued this improved:
<ul>
<li>Fiscal credibility (falling risk premia)</li>
<li>Improved security of Property Rights, leading to investment and more efficient organization (North and Weingast, 1989).</li>
</ul>
</li>
<li>A &quot;bourgeois revolution&quot;: merchants and traders expanded power over landlords.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}

;">
<h3 id="critiques">Critiques</h3>
<ul>
<li>Is this all just Whig history?</li>
<li>In many ways reforms strengthened the power of the centralized state to redefine PRs</li>
<li>e.g. Parliamentary enclosure acts often led to more concentrated land ownership, and less secure PRs for the poor.</li>
<li>Oliver Cromwell, victor of earlier English Civil War (1642-1651). Professionalized army (removed Nobility from leadership roles). Also led colonization of Ireland and wholesale exropriation of Irish Lands.</li>
<li>So perhaps less about PRs protections in general, and more about strengthened centralized State to advance the commercial interests of rising new class at home and abroad?</li>
</ul>
</section>

<h2 id="dissolution-of-the-monasteries">Dissolution of the Monasteries</h2>

<li>Heldring, Robinson, Vollmer (2021)<br />
&quot;The Long-Run Effects of the Dissolution of the English Monasteries,&quot; <em>Quarterly Journal of Economics</em></li>

<li>Republic. Abolishes feudalism, Church's right to collect tithes.</li>
<li>Strong new Army, 'total war' strategy.

<h2 id="political-institutions-during-the-commercial-revolution">Political Institutions during the Commercial Revolution</h2>

<ul>
<li>Fundamental political institutions: those that govern the selection of who rules.</li>
<li>Today one of the most important distinctions is between democracy and autocracy.</li>
<li>Democracy emerged in the ancient Greek city-states.</li>
<li>But democracy was absent for most of medieval and early modern European history.</li>
<li>Two important developments that DID occur between 1000-1300:
<ul>
<li>The rise of independent city-states</li>
<li>The rise of parliaments</li>
</ul>
</li>
</ul>

<h3 id="political-institutions-city-states">Political Institutions: City States</h3>
<ul>
<li>Independent cities emerged in Italy, the Low Countries, and Germany after c. 1000 CE.</li>
<li>These cities were self-governing and often oligarchic.</li>
<li>They were governed in the interest of the mercantile elite.</li>
<li>As such they often passed laws and established institutions favorable to trade.</li>
</ul>

<h3 id="political-institutions-parliaments">Political Institutions: Parliaments</h3>

<ul>
<li>England, Spain, and France were governed by territorial monarchies.</li>
<li>Kings in these territories called councils of their leading nobles in order to consult them.</li>
<li>Over time these councils became more formal.</li>
<li>By 1240s in England, they had acquired the name Parliament. Elsewhere in Europe, they were called cortes, estates, or parlements.</li>
<li>Forums where the king could ask for taxes from the “political nation”.</li>
<li>English “Model Parliament” of 1295 established the principle that the towns would be represented.</li>
</ul>
