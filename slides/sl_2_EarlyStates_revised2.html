<p><strong>What was life like in 1651?</strong></p>

<p>Hobbes argued humans in their natural state live in chaos, leading them to form a &quot;social contract&quot; surrendering rights to a sovereign in exchange for security.</p>

<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> higher birth rate, Lower death rate <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> larger population.<br />
<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> income per capita falls back.</p>
<p>Implications:</p>
<ul>
<li data-marpit-fragment="1">
<p>Places with higher land productivity <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> higher population density</p>
</li>
<li data-marpit-fragment="2">
<p>But, unless improvements are sustained, will return to steady sate with no higher income per capita.<br />
<br /></p>
</li>
<li data-marpit-fragment="3">
<p>Next slides investigate this claim empirically:</p>
</li>
</ul>
</section>

<h2 id="british-evidence">British evidence</h2>
<ul>
<li data-marpit-fragment="1">English data 1200-1790s</li>
<li data-marpit-fragment="2">Note effects of the Black Death &gt; 1340s</li>
<li data-marpit-fragment="3">Transition ~ 17th century
<ul>
<li data-marpit-fragment="4">Population rises without falling income per capita</li>
</ul>
</li>
<li data-marpit-fragment="5">Escape: rising pop and income per capita &gt; 1870s</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-fragments="5" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="12" data-marpit-pagination-total="80" style="" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="13" data-marpit-pagination-total="80" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;">
<h2 id="the-puzzle">The Puzzle</h2>
<ul>
<li>What forces permitted the transition from stagnation to growth?</li>
<li>Why has timing been different across regions?</li>
<li>Role of historical and pre-historical factors?</li>
</ul>
<p><strong>Galor's answer:</strong> Population size, diversity, and eventually human capital accumulation drive technological progress until a &quot;phase transition&quot; occurs.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="14" data-marpit-pagination-total="80" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;">
<h1 id="part-ii-human-capabilities">Part II: Human Capabilities</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-marpit-fragments="6" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="15" data-marpit-pagination-total="80" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;">
<h3 id="the-human-brain">The Human Brain</h3>
<ul>
<li data-marpit-fragment="1">Human brain: large, compressed, complex</li>
<li data-marpit-fragment="2">Tripled in size over 6M years, mostly 200-800K years ago</li>
<li data-marpit-fragment="3">Drawbacks:
<ul>
<li data-marpit-fragment="4">Enormous energy use</li>
<li data-marpit-fragment="5">Large size → difficult birth → 'half-baked' brains</li>
<li data-marpit-fragment="6">Helpless babies, years until maturity</li>
</ul>
</li>
</ul>
<p>Why evolved this way? Why no <em>convergent evolution</em> in other species?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-marpit-fragments="4" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="16" data-marpit-pagination-total="80" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;">
<h3 id="technology-and-human-capital">Technology and Human Capital</h3>
<ul>
<li data-marpit-fragment="1"><strong>Technology:</strong> recipes for transforming inputs into useful outputs</li>
<li data-marpit-fragment="2"><strong>Technological progress:</strong> getting more for less
<ul>
<li data-marpit-fragment="3">More/better outputs from same inputs, or same outputs with less</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>Human Capital</strong>: factors influencing worker productivity (training, skills, health)</li>
</ul>
<p><strong>Key insight:</strong> Dependent children → long parental investment → inter-generational transmission of knowledge</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-fragments="2" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}

;--marpit-advanced-background-split:35%;" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h2 id="the-puzzling-primate">The Puzzling Primate</h2>

<p><strong>Individual humans</strong> are not strongest, fastest, or most intelligent primates</p>
<ul>
<li data-marpit-fragment="1">Can't survive alone in wild without learned skills</li>
<li data-marpit-fragment="2">Lack instinctive behaviors other animals possess</li>
</ul>
<p><strong>Henrich's contest</strong>: Capuchin monkey vs. human in the wild — who wins?</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-fragments="2" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="17" data-marpit-pagination-total="80" style="" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="18" data-marpit-pagination-total="80" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;">
<h3 id="yet-humans-dominate-every-habitat">Yet Humans Dominate Every Habitat</h3>
<p><img src="attachments/sl2_arctic_people.png" alt="Image of Sl2 Arctic People" style="width:600px;" /></p>
<p><strong>Why?</strong> Culture enables solving survival problems through <strong>learned knowledge</strong><br />
rather than biological adaptation.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-fragments="3" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}

;--marpit-advanced-background-split:35%;" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h2 id="ants-vs-humans">Ants vs. Humans</h2>

<ul>
<li data-marpit-fragment="1">
<p><strong>One species of humans</strong> thrives in arctic, desert, tropical, and high-altitude environments</p>
<ul>
<li data-marpit-fragment="2"><strong>Cultural adaptation</strong> — not biological adaptation</li>
</ul>
</li>
<li data-marpit-fragment="3">
<p><strong>~15,000 ant species:</strong> each specialized for particular habitats</p>
</li>
</ul>
<br />
* One human species does what thousands of ant species cannot
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-fragments="3" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="19" data-marpit-pagination-total="80" style="" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-marpit-fragments="3" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="20" data-marpit-pagination-total="80" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;">
<h2 id="cumulative-culture">Cumulative Culture</h2>
<p><img src="attachments/sl2_stone_tool.png" alt="Image of Sl2 Stone Tool" style="width:600px;" /></p>
<ul>
<li data-marpit-fragment="1"><strong>Culture</strong> = information stored outside the genome (tools, techniques, norms)</li>
<li data-marpit-fragment="2"><strong>Cumulative</strong> = each generation builds on prior knowledge</li>
<li data-marpit-fragment="3">Over hundreds of thousands of years: simple rocks → hand axes → composite tools</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="21" data-marpit-pagination-total="80" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;">
<h3 id="fire-the-first-domestication">Fire: The First Domestication</h3>
<p><img src="attachments/Scott_quote_fire.png" alt="Image of Scott Quote Fire" style="width:950px;" /></p>
<p>Long before agriculture, hominids were domesticating the environment.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-fragments="2" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}

;--marpit-advanced-background-split:50%;" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h2 id="culture-gene-coevolution">Culture-Gene Coevolution</h2>
<p>Culture and genes evolve together in a <strong>feedback loop</strong>:</p>
<ul>
<li data-marpit-fragment="1"><strong>Gene → Culture</strong>: Predispositions for learning, imitation, language</li>
<li data-marpit-fragment="2"><strong>Culture → Gene</strong>: Cultural practices create selection pressures</li>
</ul>
<p>Example: Domestication of dairy animals → selection for lactase persistence</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-fragments="2" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}

<ul>
<li data-marpit-fragment="1"><strong>Mastery of Fire</strong><br />
(by <em>homo erectus</em> &gt;400K years ago, pre-dating <em>Homo Sapiens</em>)
<ul>
<li data-marpit-fragment="2"><strong>Cooking</strong>
<ul>
<li data-marpit-fragment="3">faster absorption of more calories → larger brains</li>
<li data-marpit-fragment="4">less chewing → less need for large jaw → more cranium space</li>
</ul>
</li>
<li data-marpit-fragment="5"><strong>Domestication of the environment</strong>
<ul>
<li data-marpit-fragment="6">The first great tool to shape the environment<br />
</li>
</ul>
</li>
</ul>
</li>
</ul>

<h3 id="mitochondrial-eve">Mitochondrial Eve</h3>

<li>Unique genetic code passed from female to female</li>
<li>Every person alive descends from this woman (~155,000 years ago)</li>
</ul>
<p><strong>Humans are remarkably similar genetically:</strong></p>
<ul>
<li>One band of chimps in the Congo has more genetic diversity than all 8 billion humans</li>
<li>Likely due to a <strong>population bottleneck</strong> ~70,000 years ago</li>
<li>All humans descend from a small surviving population — perhaps only thousands</li>
</ul>

<h2 id="the-original-affluent-society">The &quot;Original Affluent Society&quot;?</h2>

<p><strong>Marshall Sahlins</strong> (1972) challenged the view of primitive hardship:</p>
<ul>
<li data-marpit-fragment="1">Hunter-gatherers worked <strong>15-20 hours/week</strong></li>
<li data-marpit-fragment="2">Diverse, nutritious diets; extensive leisure</li>
<li data-marpit-fragment="3">Low material possessions by choice</li>
</ul>
<p><strong>James Scott</strong> adds: For most of history, people <strong>fled</strong> states when they could. The periphery was refuge, not wasteland.</p>

<h2 id="climate-and-the-fertile-crescent">Climate and the Fertile Crescent</h2>

<p><strong>End of last Ice Age (~11,700 years ago):</strong></p>
<ul>
<li data-marpit-fragment="1">Younger Dryas cold snap ends</li>
<li data-marpit-fragment="2">Warmer, wetter, and crucially <strong>more stable</strong> conditions</li>
</ul>
<p><strong>The Fertile Crescent:</strong></p>
<ul>
<li data-marpit-fragment="3">Concentration of domesticable plants: wheat, barley, lentils</li>
<li data-marpit-fragment="4">Concentration of domesticable animals: sheep, goat, cattle, pig</li>
</ul>
</section>

<p>Population pressure drove the transition:</p>
<ul>
<li data-marpit-fragment="1">Rising populations in favorable environments</li>
<li data-marpit-fragment="2">Declining wild resources per capita</li>

<p><strong>Implication:</strong> Agriculture as <strong>solution</strong> to scarcity, enabling larger populations and eventually civilization</p>

<h2 id="diamond-agriculture-as-decline">Diamond: Agriculture as Decline</h2>

<p><strong>Skeletal evidence confirms the costs:</strong></p>
<ul>
<li data-marpit-fragment="1">Shorter stature, more cavities, signs of anemia</li>
<li data-marpit-fragment="2">Repetitive stress injuries from grinding grain</li>
<li data-marpit-fragment="3">New epidemic diseases from animal proximity</li>
</ul>
<p><strong>Beyond health:</strong></p>
<ul>
<li data-marpit-fragment="4">Harder work: more hours than foraging</li>
<li data-marpit-fragment="5">Worse nutrition: dependence on fewer crops</li>
<li data-marpit-fragment="6">Inequality and bondage emerge</li>
</ul>
<p><strong>If agriculture made life worse, why did it spread?</strong></p>

<h2 id="scott-agriculture-as-precondition-for-states">Scott: Agriculture as Precondition for States</h2>

<p>James C. Scott argues:</p>
<ul>
<li data-marpit-fragment="1">Agriculture didn't require states</li>
<li data-marpit-fragment="2"><strong>States required agriculture</strong></li>
<li data-marpit-fragment="3">The &quot;domus&quot; (settled agricultural life) was a site of control, not progress.</li>
</ul>
<p><strong>The &quot;barbarians&quot; beyond the State's control:</strong></p>
<ul>
<li data-marpit-fragment="4">often refugees <em>from</em> civilization</li>
<li data-marpit-fragment="5">choosing freedom, mobility, and often better health in frontier regions,<br />
over the grain tax and the corvée.</li>
</ul>
</section>

<h2 id="grain-states">Grain States</h2>
<p>From the state's perspective, grain is ideal:</p>
<ul>
<li data-marpit-fragment="1"><strong>Visible</strong>: grows in fields, can be surveyed</li>
<li data-marpit-fragment="2"><strong>Storable</strong>: can be accumulated in granaries</li>
<li data-marpit-fragment="3"><strong>Divisible</strong>: can be measured and taxed precisely</li>
<li data-marpit-fragment="4"><strong>Predictable</strong>: harvest timing known in advance</li>
</ul>
<p>Tubers, forest products: can be hidden, left in ground, hard to tax</p>

<p><strong>What the arrangement communicates:</strong></p>
<ul>
<li data-marpit-fragment="1"><strong>Natural hierarchy</strong>: Water → Plants → Animals → Humans → Gods</li>
<li data-marpit-fragment="2">Each level supports and feeds the one above</li>
<li data-marpit-fragment="3"><strong>Surplus as sacred duty</strong>: Tribute is cosmic obligation, not theft</li>
<li data-marpit-fragment="4"><strong>Workers are naked; elites are clothed</strong></li>
</ul>
<p>The vertical reading <strong>naturalizes</strong> the flow of tribute upward. The temple mediates between humans and gods.</p>

<h2 id="olsons-stationary-versus-roving-bandits">Olson's Stationary versus Roving Bandits</h2>
<p>Olson, Mancur (1993) &quot;Dictatorship, Democracy, and Development,&quot; <em>American Political Science Review 87</em>: 567-576.</p>
<ul>
<li>
<p><strong>The Roving Bandits:</strong></p>
<ul>
<li>Move from place to place with no long-term stake.</li>
<li>Incentive: Plunder 100% of assets.</li>
<li>Result: Destroys the economy.</li>
</ul>
<br />
</li>
<li>
<p><strong>The Stationary Bandit:</strong></p>
<ul>
<li>Stays in one place (e.g., a long-term dictator).</li>
<li>Incentive: &quot;Steal&quot; (tax) at a rate that maximizes revenue <em>over time</em>.</li>
<li>Will <em>not</em> tax at 100%, as it kills future income.</li>
<li><em>May provide public goods (protection, roads, irrigation) to increase future tax base.</em></li>
</ul>
</li>
</ul>
</section>

<h2 id="land-abundance-and-coercion-or--freedom">Land Abundance and Coercion, or ... Freedom?</h2>
<ul>
<li data-marpit-fragment="1">When land is abundant, people are scarce.</li>
<li data-marpit-fragment="2">People can <strong>flee</strong> oppressive rulers</li>
<li data-marpit-fragment="3">States try to prevent &quot;leakage&quot;</li>
<li data-marpit-fragment="4">Early legal codes obsessed with runaways, escapees</li>
</ul>
<br />
* As late as 1800, perhaps **three-quarters** of world's population in some form of bondage. In Athens, slaves were **two-thirds** of population.
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-marpit-fragments="4" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}

;">
<h2 id="mesopotamian-wars-for-people">Mesopotamian Wars for People</h2>
<p><strong>Seth Richardson's research:</strong></p>
<ul>
<li data-marpit-fragment="1">Early Mesopotamian wars were <strong>not about territory</strong></li>
<li data-marpit-fragment="2">They were about <strong>capturing populations</strong></li>
<li data-marpit-fragment="3">Petty wars to conquer smaller communities, bring them to the &quot;grain core&quot;</li>
<li data-marpit-fragment="4">The prize was captives — especially women and children</li>
</ul>
<p>Scott: &quot;The state with the most people was generally richest&quot;</p>
</section>

" data-marpit-pagination="59" data-marpit-pagination-total="80" style="" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="left"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-marpit-fragments="2" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}

<h2 id="evidence-river-shifts-and-state-formation-1">Evidence: River Shifts and State Formation</h2>
<p><strong>Different empirical implications or competing theories of government:</strong></p>
<ul>
<li data-marpit-fragment="1"><strong>Extraction-based:</strong> states should form where rivers are (intact tax base).</li>
<li data-marpit-fragment="2"><strong>Cooperation-based:</strong> states should form where rivers shifted away (need collective coordination for canals).</li>
</ul>
<p>Authors distinguish between <strong>initial state formation</strong> and later evolution, acknowledging they may have become extractice.  Yet they point to continued public goods provision after state provision (when rivers shifted away), suggesting states responded to coordination demands even if also extractive.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-fragments="3" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}

;--marpit-advanced-background-split:47%;" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="why-was-state-formation-rare">Why was state formation rare?</h3>
<p>States formed as regional rainfall declined (making irrigation valuable) and where:</p>
<ul>
<li data-marpit-fragment="1">High Population density (pre-shift)</li>
<li data-marpit-fragment="2">Settlements aligned with landscape gradients (enabling canal efficiency)</li>
<li data-marpit-fragment="3">water access relatively easy and irrigation productivity gains substantial<br />
<br /><br />
Without these conditions, migration or nomadism  was a preferable alternative to state formation.</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-fragments="3" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="61" data-marpit-pagination-total="80" style="" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="62" data-marpit-pagination-total="80" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;">
<h2 id="why-did-agriculture-spread-a-synthesis-i">Why Did Agriculture Spread? A Synthesis (I)</h2>
<p>Agriculture spread not because it made life better, but by incremental steps that became irreversible:</p>
<ul>
<li><strong>Caloric density and carrying capacity:</strong> Agriculture supports 10-100X more people per square mile. More calories per acre (even though fewer calories per hour work!).  Even if individuals worse off, populations grow. Agriculturalists field more warriors.  Epidemic disease as weapon.</li>
</ul>
<table>
<thead>
<tr>
<th>Phase</th>
<th>Mechanism</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Initial experimentation</strong></td>
<td>Low-cost insurance; &quot;play farming&quot; alongside foraging</td>
</tr>
<tr>
<td><strong>Gradual intensification</strong></td>
<td>Population growth creates pressure; ratchet effects</td>
</tr>
<tr>
<td><strong>Commitment/trap</strong></td>
<td>Can't return to foraging; land becomes scarce</td>
</tr>
</tbody>
</table>
<p>Each step seemed rational. No single generation &quot;chose&quot; agricultural life—they inherited commitments made by ancestors.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="63" data-marpit-pagination-total="80" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;">
<h2 id="why-did-agriculture-spread-a-synthesis-ii">Why Did Agriculture Spread? A Synthesis (II)</h2>
<table>
<thead>
<tr>
<th>Phase</th>
<th>Mechanism</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>State formation</strong></td>
<td>Coercion extracts surplus; bondage prevents flight</td>
</tr>
<tr>
<td><strong>Expansion/conquest</strong></td>
<td>Demographic and military advantage over foragers</td>
</tr>
</tbody>
</table>
<p><strong>Who benefits?</strong></p>
<ul>
<li>Early phases: everyone (backup food source)</li>
<li>Middle phases: population grows, but individuals work harder</li>
<li>Late phases: elites benefit enormously; commoners are stuck</li>
</ul>
<p>Agriculture enabled states thatmight have formed to solve coordination problems but grew to coerce and conquer. Agricultural societies outcompeted foragers demographically and militarily—even when foragers were healthier and happier.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="64" data-marpit-pagination-total="80" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;">
<h2 id="summary-why-did-states-emerge">Summary: Why Did States Emerge?</h2>
<p>No single answer — likely all factors:</p>
<ol>
<li><strong>Geography</strong>: Grain-favorable environments made taxation possible</li>
<li><strong>Climate</strong>: Holocene stability enabled sedentary agriculture</li>
<li><strong>Coordination needs</strong>: Irrigation, defense required organization</li>
<li><strong>Coercion capacity</strong>: Surplus extraction required bondage, control</li>
<li><strong>Population dynamics</strong>: Density enabled hierarchy; open frontiers limited it</li>
</ol>
<p><strong>The debate continues:</strong> Were early states net benefits or net costs to most people?</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-marpit-fragments="4" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}

<h2 id="looking-ahead">Looking Ahead</h2>
<ul>
<li data-marpit-fragment="1">How do patterns of state formation shape long-run development?</li>
<li data-marpit-fragment="2">Why do some regions develop strong centralized states, others neevr or weak?</li>
<li data-marpit-fragment="3">Where, when, and how do property rights and other institutions emerge and evolve?</li>
<li data-marpit-fragment="4">What explains the eventual &quot;escape&quot; from the Malthusian trap?</li>
</ul>
</section>

</ul>

<h2 id="climate-variability-and-civilizations">Climate Variability and Civilizations</h2>
<p><br />
<strong>Medieval Warm Period (900-1300 CE)</strong></p>
<ul>
<li>North Atlantic warming → Viking expansion, Greenland settlement</li>
</ul>
<p><strong>Little Ice Age (1300-1850 CE)</strong></p>
<ul>
<li>Glacier growth, failed harvests</li>
<li>Viking Greenland collapse, widespread European famines</li>
<li>Demonstrates how climate variability shapes civilizations</li>
</ul>
</section>

<h2 id="modern-period-industrialization-and-unprecedented-warming">Modern Period: Industrialization and Unprecedented Warming</h2>
<p><strong>1850-present</strong></p>

<ul>
<li>General warming begins ~1850</li>
<li><strong>Accelerated warming since 1950</strong> (industrial era)</li>
<li>Glacier retreat, sea level rise</li>
<li>Rate of change unprecedented in human history</li>
<li>Unlike past climate shifts, this change is rapid and human-caused</li>
</ul>
</section>

;--marpit-advanced-background-split:35%;" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="jared-diamond-agricultural-advantage-as-conquest">Jared Diamond: Agricultural Advantage as Conquest</h3>

<p><strong>&quot;Guns, Germs, and Steel&quot; Thesis:</strong></p>
<p>States with earlier agriculture developed <strong>larger, stratified populations</strong> with better technologies:</p>
<ul>
<li data-marpit-fragment="1">Domesticated animals → disease immunity</li>
<li data-marpit-fragment="2">Surplus → specialization<br />
→ weapons and military technology</li>
<li data-marpit-fragment="3">Warrior/raider classes emerge</li>
</ul>
<p><strong>Result:</strong> Earlier agricultural societies <strong>conquer and displace</strong> hunter-gatherers and later development agricultural societies.</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-fragments="3" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="70" data-marpit-pagination-total="80" style="" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-marpit-fragments="6" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="71" data-marpit-pagination-total="80" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;">
<h2 id="classic-cases-of-conquest-based-expansion">Classic Cases of Conquest-Based Expansion</h2>
<p><strong>European Conquest of Americas (1492+)</strong></p>
<ul>
<li data-marpit-fragment="1">Epidemic disease killed 90% of indigenous populations</li>
<li data-marpit-fragment="2">Steel weapons, horses, and military technology</li>
<li data-marpit-fragment="3">Military conquest despite being outnumbered</li>
</ul>
<p><strong>Arab/Islamic Expansion (7th-8th centuries)</strong></p>
<ul>
<li data-marpit-fragment="4">Fertile Crescent agriculture + domesticated animals</li>
<li data-marpit-fragment="5">Iron weapons, organized armies</li>
<li data-marpit-fragment="6">Conquest across North Africa, Iberia, Central Asia</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-marpit-fragments="5" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="72" data-marpit-pagination-total="80" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;">
<h2 id="classic-cases-of-conquest-based-expansion-contd">Classic Cases of Conquest-Based Expansion (contd)</h2>
<p><strong>Chinese Expansion South</strong></p>
<ul>
<li data-marpit-fragment="1">Early agriculture (Yellow River basin)</li>
<li data-marpit-fragment="2">Iron technology, large populations</li>
<li data-marpit-fragment="3">Gradual conquest and assimilation of southern regions</li>
</ul>
<p><strong>Mongol Empire</strong></p>
<ul>
<li data-marpit-fragment="4">Pastoral horse nomads with superior cavalry technology</li>
<li data-marpit-fragment="5">Conquered vast agricultural societies through military force</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="73" data-marpit-pagination-total="80" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;">
<h2 id="but-are-all-agricultural-expansions-the-same">But Are All Agricultural Expansions the Same?</h2>
<p><strong>Three Different Models of Expansion:</strong></p>
<table>
<thead>
<tr>
<th><strong>Model</strong></th>
<th><strong>Primary Driver</strong></th>
<th><strong>Mechanism</strong></th>
<th><strong>Interaction</strong></th>
<th><strong>State Formation</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Diamond's Model</strong></td>
<td>Agriculture + disease immunity</td>
<td>Military conquest</td>
<td>Violent displacement</td>
<td>Coercive extraction</td>
</tr>
<tr>
<td><strong>Bantu Expansion</strong></td>
<td>Agriculture + population growth</td>
<td>Gradual settlement</td>
<td>Intermarriage &amp; mixing</td>
<td>Late (16th-19th centuries)</td>
</tr>
<tr>
<td><strong>Austronesian Expansion</strong></td>
<td>Maritime technology</td>
<td>Peaceful settlement</td>
<td>Demographic assimilation</td>
<td>Maritime trade-based (2nd-7th centuries)</td>
</tr>
</tbody>
</table>
<p><strong>Key point:</strong> Not all agricultural expansions followed Diamond's conquest model</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-fragments="5" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}

" data-marpit-pagination="74" data-marpit-pagination-total="80" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;--marpit-advanced-background-split:30%;" data-marpit-advanced-background="content" data-marpit-advanced-background-split="left">
<h3 id="early-bantu-expansion-settlement">Early Bantu Expansion: Settlement</h3>

<p><strong>Timeline:</strong> ~3000 BCE - 1000 CE</p>
<p><strong>Origin &amp; Extent:</strong> West-Central Africa (Cameroon/Nigeria) → spread across sub-Saharan Africa</p>
<p><strong>Key differences from Diamond:</strong></p>
<ul>
<li data-marpit-fragment="1">Primarily <strong>settlement-based</strong>, not militaristic conquest</li>
<li data-marpit-fragment="2">Small migrating groups, not conquering armies</li>
<li data-marpit-fragment="3"><strong>Intermarriage</strong> with San/Khoisan hunter-gatherers common</li>
<li data-marpit-fragment="4">Iron-working came <em>centuries after</em> initial expansion</li>
<li data-marpit-fragment="5"><strong>Demographic dominance</strong> through population growth</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-fragments="5" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="74" data-marpit-pagination-total="80" style="" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="left"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-fragments="6" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="75" data-marpit-pagination-total="80" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;--marpit-advanced-background-split:50%;" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;attachments/map_bantu_language.png&quot;);background-size:500px auto;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="75" data-marpit-fragments="6" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="75" data-marpit-pagination-total="80" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;--marpit-advanced-background-split:50%;" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h2 id="later-bantu-expansion-state-conquest">Later Bantu Expansion: State Conquest</h2>

<p><strong>Early Expansion (3000 BCE - 1000 CE):</strong></p>
<ul>
<li data-marpit-fragment="1">Decentralized communities</li>
<li data-marpit-fragment="2">Gradual colonization with cultural mixing</li>
</ul>
<p><strong>States emerged <em>much later</em> (13th-19th centuries):</strong></p>
<ul>
<li data-marpit-fragment="3">Kingdom of Kongo</li>
<li data-marpit-fragment="4">Lunda Empire</li>
<li data-marpit-fragment="5">Great Zimbabwe</li>
<li data-marpit-fragment="6">Zulu, Ndebele (warrior kingdoms, 19th century)</li>
</ul>
<p><strong>Pattern:</strong><br />
Peaceful settlement → population growth → <strong>later</strong> state consolidation and militarization</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-fragments="6" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="75" data-marpit-pagination-total="80" style="" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-fragments="4" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="76" data-marpit-pagination-total="80" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;--marpit-advanced-background-split:40%;" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;attachments/polynesian.png&quot;);background-size:500px auto;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="76" data-marpit-fragments="4" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="76" data-marpit-pagination-total="80" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;--marpit-advanced-background-split:40%;" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h2 id="the-austronesian-expansion-maritime-innovation">The Austronesian Expansion: Maritime Innovation</h2>

<p><strong>Timeline:</strong> ~3000 BCE onward; most intensive 2000 BCE - 1 CE</p>
<p><strong>Origin &amp; Extent:</strong> Taiwan/Southeast Asia → half the planet</p>
<ul>
<li data-marpit-fragment="1"><strong>West</strong>: Madagascar. <strong>East</strong>: Easter Island, Hawaii. <strong>South</strong>: New Zealand (~1280 CE)</li>
</ul>
<p><strong>Revolutionary maritime technology</strong></p>
<ul>
<li data-marpit-fragment="2">Outrigger canoes and catamarans</li>
<li data-marpit-fragment="3">Sophisticated wayfinding (star paths, wave patterns, bird observations)</li>
<li data-marpit-fragment="4">Settled previously uninhabited Pacific islands</li>
</ul>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-fragments="4" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="76" data-marpit-pagination-total="80" style="" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-marpit-fragments="7" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="77" data-marpit-pagination-total="80" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;">
<h2 id="austronesian-expansion-initial-peaceful-settlement">Austronesian Expansion: Initial Peaceful Settlement</h2>
<p><strong>Mechanism:</strong> Settlement colonization, not military conquest</p>
<ul>
<li data-marpit-fragment="1">Peaceful <strong>demographic assimilation</strong> with indigenous groups</li>
<li data-marpit-fragment="2">High rates of intermarriage in Indonesia</li>
<li data-marpit-fragment="3">Exception: &quot;Neolithic standoff&quot; in New Guinea (indigenous agricultural societies resisted cultural displacement)</li>
</ul>
<p><strong>Agricultural package:</strong> Rice cultivation, domesticated animals (pigs, chickens), crops</p>
<p><strong>State formation came much later (2nd-7th centuries CE):</strong></p>
<ul>
<li data-marpit-fragment="4">Maritime <strong>trade networks</strong> → thalassocracies (sea-based polities)</li>
<li data-marpit-fragment="5">Srivijaya, Majapahit empires</li>
<li data-marpit-fragment="6">Based on controlling <strong>trading ports (emporia)</strong>, not territorial conquest</li>
<li data-marpit-fragment="7">Some adopted foreign (Hindu) administrative models</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-marpit-fragments="8" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="78" data-marpit-pagination-total="80" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;">
<h2 id="the-m%C4%81ori-from-peaceful-settlers-to-fierce-warriors">The Māori: From Peaceful Settlers to Fierce Warriors</h2>
<p><strong>Austronesian/Polynesian settlers</strong> arrived in New Zealand ~1280 CE</p>
<ul>
<li data-marpit-fragment="1">Found rich, previously uninhabited territory</li>
<li data-marpit-fragment="2">No human competition or endemic disease</li>
</ul>
<p><strong>Later development (15th-19th centuries):</strong></p>
<ul>
<li data-marpit-fragment="3">Population growth + resource competition</li>
<li data-marpit-fragment="4"><strong>Fierce inter-tribal warfare</strong> developed</li>
<li data-marpit-fragment="5">Fortified villages (pā), hierarchical chiefdoms</li>
<li data-marpit-fragment="6">Warrior culture and territorial conquest emerged</li>
</ul>
<p><strong>Key insight:</strong> <strong>Sequence matters</strong></p>
<ul>
<li data-marpit-fragment="7">Peaceful settlement first → Later militarization as constraints emerged</li>
<li data-marpit-fragment="8">Supports Allen et al.: institutions created for cooperation can later be used for coercion</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-marpit-fragments="7" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="79" data-marpit-pagination-total="80" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;">
<h2 id="what-explains-different-expansion-patterns">What Explains Different Expansion Patterns?</h2>
<p><strong>Empty vs. occupied territory:</strong></p>
<ul>
<li data-marpit-fragment="1">Pacific islands (Austronesian): No competition → peaceful colonization</li>
<li data-marpit-fragment="2">Americas (European): Indigenous populations → violent conquest</li>
</ul>
<p><strong>Disease asymmetry:</strong></p>
<ul>
<li data-marpit-fragment="3">Europeans: Epidemic disease as devastating weapon</li>
<li data-marpit-fragment="4">Bantu/Austronesian: Less disease differential</li>
</ul>
<p><strong>Technology type:</strong></p>
<ul>
<li data-marpit-fragment="5">Military technology (European, Arab) → conquest-based</li>
<li data-marpit-fragment="6">Maritime technology (Austronesian) → settlement-based colonization</li>
<li data-marpit-fragment="7">Agricultural productivity (Bantu) → demographic growth</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-marpit-fragments="3" data-paginate="true" data-theme="gaia" data-style="section {font-size: 26px;}
" data-marpit-pagination="80" data-marpit-pagination-total="80" style="--paginate:true;--theme:gaia;--style:section {font-size: 26px;}
;">
<p><strong>State formation timeline:</strong></p>
<ul>
<li data-marpit-fragment="1">States before expansion → conquest more likely (organized armies available)</li>
<li data-marpit-fragment="2">States after expansion → settlement pattern → later militarization</li>
<li data-marpit-fragment="3">Trade networks → thalassocracies (maritime states)</li>
</ul>
