<h2 id="epochs-and-transitions">Epochs and Transitions</h2>
<p><strong>How did the World Get Rich?</strong></p>
<ul>
<li data-marpit-fragment="1">Why did the Malthusian epoch last so long?</li>
<li data-marpit-fragment="2">What led to the transition? (per-capita incomes not declining with pop growth).</li>
<li data-marpit-fragment="3">What led to escape into the era of Modern Economic Growth?</li>
</ul>
<footer>Eco 331</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-fragments="9" data-paginate="true" data-footer="Eco 331" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="5" data-marpit-pagination-total="100" style="--paginate:true;--footer:Eco 331;--style:section {font-size: 26px;}
;--theme:gaia;">
<h3 id="another-framing">Another framing:</h3>
<ul>
<li data-marpit-fragment="1">Where, how, and why did <em>capitalism</em> arise as an economic system?
<ul>
<li data-marpit-fragment="2">Private Property</li>
<li data-marpit-fragment="3">Markets, specialization, and trade.</li>
<li data-marpit-fragment="4">Firms</li>
</ul>
</li>
</ul>
<br />
<ul>
<li data-marpit-fragment="5">&quot;Capitalist imperatives&quot;:
<ul>
<li data-marpit-fragment="6">labor needs to sell labor to market to survive.</li>
<li data-marpit-fragment="7">Firms must accumulate, cut costs, innovate or fail.</li>
</ul>
</li>
</ul>
<br />
<ul>
<li data-marpit-fragment="8">before capitalism: 'markets' embedded in social relations.</li>
<li data-marpit-fragment="9">with capitalism: social relations embedded in markets.</li>
</ul>
<footer>Eco 331</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-footer="Eco 331" data-style="section {font-size: 26px;}

<h2 id="global-context-1000---1300-ce">Global Context (~1000 - 1300 CE)</h2>
<div style="font-size: 15px; text-align: right; margin-top: -10px;"> <a href="https://worldhist.org/">Historical Maps</a> </div>
<ul>
<li>If you surveyed the world in 1200 CE, Western Europe appeared as an economic and political <strong>backwater</strong>.</li>
<li><strong>The Core:</strong> The centers of global wealth, urbanization, and technological innovation were in the East and the Islamic world.</li>
<li><strong>The Periphery:</strong> Europe was politically fragmented, highly decentralized, and agrarian.</li>
<li><strong>The Puzzle:</strong> Why did the transition to capitalism and modern economic growth eventually happen in this peripheral region?</li>
</ul>
<footer>Eco 331</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-footer="Eco 331" data-style="section {font-size: 26px;}

<h3 id="advanced-core-song-dynasty-china">Advanced Core: Song Dynasty China</h3>

<ul>
<li><strong>Peak of Pre-Industrial Growth:</strong> The Song (960–1279 CE) and Ming dynasties achieved were centers of economic complexity.</li>
<li><strong>Achievements:</strong>
<ul>
<li>Commercialization and urbanization.
<ul>
<li>Inventions: paper money, the magnetic compass, gunpowder, and even movable type printing.</li>
</ul>
</li>
<li>High agricultural yields.</li>
</ul>
</li>
<li><strong>The Needham Puzzle:</strong> Despite this head start, China did not undergo the Industrial Revolution first.</li>
</ul>
<footer>Eco 331</footer>
</section>

<h3 id="the-islamic-golden-age">The Islamic Golden Age</h3>

<ul>
<li><strong>Center of Trade and Learning:</strong> From the 8th to the 14th centuries, the Islamic world was the geographic and intellectual center of the world.</li>
<li><strong>Achievements:</strong>
<ul>
<li>Translated and preserved classical Greek and Persian texts.</li>
<li>Big advancements in mathematics (algebra), astronomy, and medicine.</li>
<li>Extensive trade networks from Spain to India.</li>
</ul>
</li>
</ul>
<footer>Eco 331</footer>

;--theme:gaia;">
<h3 id="persian-and-classical-heritage">Persian and Classical Heritage</h3>
<ul>
<li><strong>Persian Empires:</strong> Long history of centralized statecraft, sophisticated agriculture (<em>qanats</em> irrigation), and trade along Silk Road.</li>
<li><strong>The Paradox:</strong> As discussed (Timur Kuran), early institutional advantages eventually became bottlenecks.<br />
<br /><br />
<br /></li>
<li><strong>Classical Antiquity:</strong> Europe <em>was</em> once highly advanced under the Greco-Roman tradition.</li>
</ul>
<footer>Eco 331</footer>
</section>

<h2 id="fall-of-the-roman-empire">Fall of the Roman Empire</h2>

<ul>
<li><strong>Power Vacuum (c. 476 CE):</strong> Collapse of the Western Roman Empire eliminated centralized governance and the protection of the Roman legions.</li>
<li><strong>Economic Contraction:</strong>
<ul>
<li>De-urbanization. Rome's population fell from 1 million to a few tens of thousands.</li>
<li>Collapse of long-distance trade and disappearance of formal monetary economy.</li>
</ul>
</li>
<li><strong>Adaptation:</strong> Local populations needed security from invasions (Germanic tribes, later Vikings and Magyars).</li>
</ul>
<footer>Eco 331</footer>

<h2 id="the-rise-of-feudalism">The Rise of Feudalism</h2>

<ul>
<li><strong>A Response to Chaos:</strong> Feudalism was a decentralized military and political system that emerged to fill the power vacuum.</li>
<li><strong>Oaths and Loyalty:</strong> Kings granted land (fiefs) to lords and vassals in exchange for military service (knights).</li>
<li><strong>Chains of Obligation:</strong> Personal loyalty and localized control replaced imperial bureaucracy and formal Roman law.</li>
</ul>
<footer>Eco 331</footer>

<h3 id="manorialism-the-economic-foundation">Manorialism: The Economic Foundation</h3>
<ul>
<li><strong>Economic Fragmentation:</strong> The massive, commercial Roman <em>latifundia</em> gradually evolved into local, self-sufficient medieval manors.</li>
<li><strong>Serfdom:</strong> Independent peasants traded their labor and their mobility in exchange for physical protection from the local lord.
<ul>
<li>Peasants became <em>serfs</em>, legally tied to the land.</li>
</ul>
</li>
<li><strong>Local Focus:</strong> Subsistence agriculture prioritized over market production. Focus on the <em>three-field system</em>.</li>
<li><strong>The Starting Line for Capitalism:</strong> This fragmented, highly coercive, non-market framework is the starting point from which Western European capitalism would eventually emerge.</li>
</ul>
<footer>Eco 331</footer>

<h3 id="the-open-field-system">The Open Field System</h3>

<ul>
<li>Prevalent in Europe during middle ages (also Russia, Iran, Turkey)</li>
<li>Each manor had 2-3 open fields of several hundred acres.
<ul>
<li>divided into narrow strips of land or furlongs.</li>
</ul>
</li>
</ul>
<footer>Eco 331</footer>

<h2 id="emergence-of-manorial-system">Emergence of manorial system</h2>
<ul>
<li><strong>Late Roman villa system</strong> (43CE- 5CE) with central estate worked by tenant farmers and slaves.</li>
<li>Anglo Saxon settlements (5-11CE) territorial units and place names.</li>
<li><strong>Post-Roman organization:</strong> local landlords took on protective and administrative roles for surrounding communities.</li>
</ul>
<ul>
<li data-marpit-fragment="1"><strong>The Manor:</strong> legal, economic and administrative unit.</li>
<li data-marpit-fragment="2"><strong>Norman Conquest 1066</strong>: imposed harsher and more uniform manorial structures.<br />
</li>
</ul>
<footer>Eco 331</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-fragments="2" data-paginate="true" data-footer="Eco 331" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="25" data-marpit-pagination-total="100" style="" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-footer="Eco 331" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="26" data-marpit-pagination-total="100" style="--paginate:true;--footer:Eco 331;--style:section {font-size: 26px;}
;--theme:gaia;">
<h2 id="land-tenure-and-labor-services">Land Tenure and Labor Services</h2>
<ul>
<li>Crown was only <em>alloidal</em> land owner.  All others 'held' land from the Crown.</li>
<li>Lords (tenants in chief) had rights granted by the King</li>
<li>Sub-tenants rented land from the Lord. Could be free or unfree.</li>
<li>Serfs (villeins) not free to leave for other locations or occupations without penalties.
<ul>
<li>Charged rent, fines, labor-services.</li>
<li>Could accumulate property and pass tenancy on to heirs.</li>
<li>firm rights to cropland and commons, passed down through generations.
<ul>
<li>Lord could not evict tenant without cause.</li>
</ul>
</li>
</ul>
</li>
<li>Complex system of rights and obligations, varied by region and time.</li>
<li>Over time serfdom ended and relationship that of customary tenants.</li>
</ul>
<footer>Eco 331</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-footer="Eco 331" data-style="section {font-size: 26px;}

" data-theme="gaia" data-marpit-pagination="27" data-marpit-pagination-total="100" style="--paginate:true;--footer:Eco 331;--style:section {font-size: 26px;}
;--theme:gaia;--marpit-advanced-background-split:50%;" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h3 id="from-manoralism-and-the-middle-ages-to-agrarian-capitalism">From Manoralism and the Middle Ages to Agrarian Capitalism</h3>
<ul>
<li>Transformation of feudal and peasant PRs and social order.</li>
<li>Development of private property rights to land.</li>
<li>Improvements, technology, rising agricultural productivity</li>
<li>Structural transformation: rural to urban</li>
<li>'From below' or 'from above'? Via evolutionary and negotiated change or via conflict, eviction and theft?</li>
</ul>
<footer>Eco 331</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-footer="Eco 331" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="27" data-marpit-pagination-total="100" style="" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-footer="Eco 331" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="28" data-marpit-pagination-total="100" style="--paginate:true;--footer:Eco 331;--style:section {font-size: 26px;}
;--theme:gaia;">
<h3 id="differentiation-and-market-activity">Differentiation and Market activity</h3>
<ul>
<li>villeins: serfs or unfree tenants. Tied Could not move away, marry, inherit or sell without the lord's permission.</li>
<li>freeholders: had free tenure. Owed fixed rent to the lord but few feudal services. They could sell or inherit without lord's permission.</li>
<li>cottars: Occupied cottages and cultivated small land lots.</li>
<li>Free and unfree tenants often had significant holdings (30 acres or more)</li>
<li>Often hired laborers to fulfill labor services.</li>
<li>Might offer land to cotter (though lord regulated)</li>
</ul>
<footer>Eco 331</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-footer="Eco 331" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="29" data-marpit-pagination-total="100" style="--paginate:true;--footer:Eco 331;--style:section {font-size: 26px;}
;--theme:gaia;">
<h3 id="manorial-rights">Manorial Rights</h3>
<ul>
<li>Waste rights : fells, mountains, marsh.  Technically ownership vested in the lord, but Lord's ability to change use by enclosure restricted by common rights of tenants (e.g. to take wood, peat, pasture).</li>
<li>Lord: Game, Fisheries, Mills, minerals.
<ul>
<li>Mill tolls</li>
</ul>
</li>
<li>Woodland: rights to timber vs underwood.</li>
</ul>
<footer>Eco 331</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-footer="Eco 331" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="30" data-marpit-pagination-total="100" style="--paginate:true;--footer:Eco 331;--style:section {font-size: 26px;}
;--theme:gaia;">
<h3 id="manorial-courts">Manorial Courts</h3>
<ul>
<li>Infringement of lord's priviliges
<ul>
<li>fishing/hunting without permission</li>
<li>cutting timber/underwood w/o license</li>
<li>encroachment or intakes on lords' soil</li>
<li>not grinding corn at lord's mill</li>
</ul>
</li>
<li>Offenses to Public order and stability of community
<ul>
<li>breaching king's peace (fighting, pilfering, slanders, vagabondage)</li>
<li>keeping under-tenants or harboring 'inmates' (e.g. allowing building of cottages, etc)</li>
</ul>
</li>
<li>Offenses against common rights and neighborhood:
<ul>
<li>'stray' livestock or grazing where not allowed</li>
<li>failure to maintain fences, gates, water channels, etc.</li>
<li>burning waste on wrong dates, etc.</li>
</ul>
</li>
</ul>
<footer>Eco 331</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-footer="Eco 331" data-style="section {font-size: 26px;}

<h3 id="manorial-records">Manorial Records</h3>
<ul>
<li>Example <a href="https://www.lancaster.ac.uk/fass/projects/manorialrecords/manors/classes.htm">Cumbrian Manorial Records</a></li>
<li>Manorial officials: Bailiffs (paid official) and Reeves/Graves (usually a tenant who collected the rents and fines).</li>
<li>Entry fines and heriots (due at death of tenant).</li>
<li>Admittance: admitting individual to a tenancy (e.g. marriage, inheritance, surrender)</li>
</ul>

<h3 id="fines-gresums">Fines (gresums):</h3>
<ul>
<li>
<p>e.g. Bleatarn Manor in Lancaster, annual fine income ~10X rents <a href="https://www.lancaster.ac.uk/fass/projects/manorialrecords/gallery/fines.htm">source</a></p>
</li>
<li>
<p><em>merchet</em> fine paid upon marriage.</p>
</li>
<li>
<p>the <em>filstingpound</em> (insurance against corporal punishment)</p>
</li>
<li>
<p><em>leyrwite</em> (fine for bearing a child outside of wedlock).</p>
</li>
<li>
<p><em>Entry fines</em>: paid at time of death/inheritance/sale/new.</p>
</li>
<li>
<p>Fines often worth as much as 20X annual rent.</p>
</li>
</ul>

" data-theme="gaia" data-marpit-pagination="34" data-marpit-pagination-total="100" style="--paginate:true;--footer:Eco 331;--style:section {font-size: 26px;}
;--theme:gaia;">
<h2 id="some-major-events">Some major Events</h2>
<ul>
<li>Statute of <em>Quia emptores</em> 1290 forbids further subinfeudation.
<ul>
<li>Allowed tenants to sell tenancy to another (substitute) but not create further vassal sub-tenants. Fealty to the crown. Expanded market transactions and common law.</li>
</ul>
</li>
<li>Black Death (1348-1350) subsequent population collapse</li>
<li>Peasant Revolt of 1381</li>
<li>Dissolution of the Monasteries (16th century)</li>
<li>Tudor Enclosures and reaction (16th century)</li>
<li>Parliamentary Enclosures (18-19thth century)</li>
</ul>
<footer>Eco 331</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-marpit-scope-qcANxCeK="" data-paginate="true" data-footer="Eco 331" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="35" data-marpit-pagination-total="100" style="--paginate:true;--footer:Eco 331;--style:section {font-size: 26px;}
;--theme:gaia;">
<blockquote>
<p>[For neo-classical economics,] an economic transaction is<br />
a solved political problem. Economics has gained the title of queen of the social sciences by choosing solved political problems as its domain.</p>
</blockquote>
<ul>
<li>Neo-institutional and marxist focus on property rights and political economy.</li>
</ul>
<footer>Eco 331</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-footer="Eco 331" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="36" data-marpit-pagination-total="100" style="--paginate:true;--footer:Eco 331;--style:section {font-size: 26px;}
;--theme:gaia;">
<h2 id="contrasting-views-on-the-transformation-of-institutions">Contrasting views on the transformation of Institutions</h2>
<ul>
<li><strong>The Commercialization (neo-Smithian) Model</strong>
<ul>
<li>Stresses factors such as population, the rise of markets, and the development of new technologies as driving institutional change.</li>
<li>Some economic historians, including North and Thomas (1973) went as far as to argue that serfdom was a contractual arrangement (service for protection), but the value of the services and the terms of the contract changed in response to demographic and other pressures.</li>
<li>Feudal and other institutions held back people's natural tendency to want to improve and engage in trade and specialization. Over time, as markets thickened and technologies improved, it became in the interest of groups to remove these restrictions and new institutions emerged that paved way for capitalism.</li>
</ul>
</li>
</ul>
<footer>Eco 331</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-footer="Eco 331" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="37" data-marpit-pagination-total="100" style="--paginate:true;--footer:Eco 331;--style:section {font-size: 26px;}
;--theme:gaia;">
<h2 id="contrasting-views-on-the-transformation-of-institutions-1">Contrasting views on the transformation of Institutions</h2>
<ul>
<li><strong>Marxist Perspectives</strong>
<ul>
<li>Give more prominence to class conflict and the 'balance of class forces'.</li>
<li>For example would argue that from 11th to 14th century, landlords gained the upper hand and converted many formerly more free peasants into serfs.  Norman Conquest of 1066 strengthened the power of the nobility and the Church further.</li>
<li>Malthusian would say high pre-Black death population led to low wages, population collapse led to higher wages.</li>
<li>Many marxists would argue low wages were explained by landlord exploitation rather than Malthusian factors.</li>
</ul>
</li>
</ul>
<footer>Eco 331</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-footer="Eco 331" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="38" data-marpit-pagination-total="100" style="--paginate:true;--footer:Eco 331;--style:section {font-size: 26px;}
;--theme:gaia;">
<h3 id="robert-brenner-and-the-political-marxists">Robert Brenner and the Political Marxists</h3>
<ul>
<li>Famous 'Brenner Debate' followed 1976 critique of neo-Smithian and neo-Malthusian views of the transition to capitalism.</li>
<li><strong><em>Political Marxists</em></strong> such as Brenner and Wood go as far as to argue that class conflict is largely 'autonomous' or independent of demographic and technological factors.</li>
<li>There is no 'natural' tendency to accumulate and improve, indeed under Feudalism Lords found it more profitable to squeeze peasants and build miltary might. Peasants had little incentive to accumulate and sell to the market, because markets were limited and distorted.</li>
<li>Where landlords were strong and organized they could extract surplus from peasants via extra-economic means -- via compulsions and limits on mobility such as serfdom. Where peasants could resist, peasants were more free and better off.</li>
</ul>
<footer>Eco 331</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-footer="Eco 331" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="39" data-marpit-pagination-total="100" style="--paginate:true;--footer:Eco 331;--style:section {font-size: 26px;}
;--theme:gaia;">
<ul>
<li><strong>Neo-Malthusian view</strong>: high popn in England pre-Black death led to low wages and serfdom. Low population post Black Death led to higher wages and end of serfdom.</li>
<li><strong>Brenner critique:</strong> The Malthusian pattern is NOT true across Europe.
<ul>
<li>France: pre-Black death had high popn but strong peasant property and low rents.</li>
<li>Eastern Europe: serfdom imposed on relatively free peasantry <em>after</em> Black death.</li>
</ul>
</li>
<li>Hence (according to Brenner) where landlords were strong and organized they could impose serfdom. Where peasants could resist, peasants were more free and better off.</li>
<li>Capitalism and 'capitalist imperatives' emerged first in England because landlords eventually prevailed in dispossesing peasants from the land, forcing them to become 'free' wage laborers, with no choice but to participate in markets.</li>
</ul>
<footer>Eco 331</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-footer="Eco 331" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="40" data-marpit-pagination-total="100" style="--paginate:true;--footer:Eco 331;--style:section {font-size: 26px;}
;--theme:gaia;">
<h3 id="other-marxist-perspectives">Other Marxist Perspectives</h3>
<ul>
<li>Not all Marxists agree with Brenner's view that class conflict is mostly 'autonomous.'</li>
<li>Famous marxists such as Rodney Hinton saw the Black plague and other factors including commercialization as helping to precipitate the 'feudal crisis' after the 14th century.</li>
<li>Yet they do still place 'conflict' at the center of their arguments and argue the feudal system would have eventually faced crisisbecause it was based a largely 'non-entrepreneurial' landlord class extracting surplus from peasants via coercive means.</li>
</ul>
<footer>Eco 331</footer>
</section>

;--theme:gaia;">
<h3 id="neo-smithian-interpretation">Neo-smithian interpretation</h3>
<ul>
<li data-marpit-fragment="1">
<p>North and Thomas and neo-institutionalists fit into the &quot;neo-Smithian&quot; or commercialization interpretation of history.</p>
</li>
<li data-marpit-fragment="2">
<p>Costs of creating/enforcing PRs may exceed benefits to any group or individual.</p>
</li>
<li data-marpit-fragment="3">
<p>But as benefits of PRs increase (driven by technology, Smithian expansion of commerce and trade, etc) benefits rise to exceed costs in creation of new PRs.</p>
</li>
<li data-marpit-fragment="4">
<p>May be resistance and delay, but inexorable trend towards more efficient PRs.</p>
<ul>
<li><strong>Land policy in early modern Spain.</strong>  Agriculture efficiency might have improved with more exclusive PRs to protect crop lands from <em>Mesta</em> sheperds guild which ahd custormy rights to drive sheep across Spain (and paid royal fees).
<ul>
<li>Social return &gt; private return to change.</li>
<li>Crown did not want to risk losing the Mesta guild's support.</li>
<li>Why didn't farmers just bribe sheperds to stay off their land?</li>
</ul>
</li>
</ul>
</li>
</ul>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-marpit-fragments="1" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="50" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<h2 id="the-commercialization-or-neo-smithian-model">The Commercialization or neo-Smithian model</h2>
<p><strong>Ellen Wood's critique</strong>:</p>
<ul>
<li>This explanation of origin of capitalism presupposes it is natural outcome of human practices.  Required only maturation and removal of external obstacles.
<ul>
<li>Smith's &quot;truck, barter, and trade.&quot; From the beginning, rational self-interest leading to profit maximization.</li>
</ul>
</li>
</ul>
<ul>
<li data-marpit-fragment="1">Conflict over institutional change may play a role, but &quot;[in this view] capitalism had existed, at least in embryo, from the dawn of history, if not in the very core of human nature (Wood).&quot;</li>
</ul>
<ul>
<li>External forces help overcome obstacles:
<ul>
<li>technological improvements.</li>
<li>opportunities for trade expanded.</li>
<li>expansion of autonomous cities</li>
</ul>
</li>
</ul>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="51" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<h3 id="wood-continued">Wood (continued)</h3>
<ul>
<li>Early Marx and many marxists adopt neo-smithian view too: history as further division of labor, technological progress, burgher classes bring about capitalism by freeing selves of feudal fetters.</li>
<li>But the later Marx of <em>Capital</em> insists that capital is a new social relation.</li>
<li>Critical transformation of social property rights: expropriation of direct producers.
<ul>
<li>Dispossed became wage laborers</li>
<li>Rents derived from new commercial profits of capitalist tenants.</li>
</ul>
</li>
<li>&quot;the market became capitalist when it became compulsory.&quot;</li>
<li>Capitalist imperatives</li>
</ul>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="52" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<h2 id="questions">Questions</h2>
<ul>
<li>
<p>How did serfdom and feudalism end in England?</p>
</li>
<li>
<p>Why tenancies?</p>
</li>
<li>
<p>Why are some tenancies more secure than others?</p>
</li>
<li>
<p>Why was land left fallow?</p>
</li>
<li>
<p>What is the tragedy of the commons?  Was this a problem in English manors/villages?</p>
</li>
<li>
<p>What was the enclosure movement?</p>
</li>
<li>
<p>What were the economic and social consequences of enclosure?</p>
</li>
<li>
<p>Are large farms more efficient than small farms (or in what contexts)?</p>
</li>
<li>
<p>Brenner's argument: what is the role of class conflict in the transition to capitalism?</p>
</li>
</ul>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="53" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<h3 id="questions-and-terms">Questions and Terms</h3>
<ul>
<li>
<p>What are Property Rights?   Where do they come from?</p>
</li>
<li>
<p>What are the different types/dimensions of property rights to land?</p>
<ul>
<li>Bundles of rights: to use, inherit, exclude, alienate...</li>
<li>Exclusive, secure, alienable.</li>
</ul>
</li>
<li>
<p>Open access, Common property, private property.</p>
</li>
<li>
<p>Customary vs. statutory rights.</p>
</li>
<li>
<p>Property rights enforcement</p>
<ul>
<li>private and community/public costs</li>
</ul>
</li>
<li>
<p>When is it socially/privately optimal to establish and enforce exclusive property claims?</p>
</li>
</ul>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="54" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<h3 id="evolutionary-theories-of-property-rights">Evolutionary Theories of Property Rights</h3>
<ul>
<li>Ronald Coase (1937)</li>
<li>Esther Boserup (1965)</li>
<li>Alchian and Demsetz (1972), North and Thomas (1973) and others.</li>
</ul>
<p>Establishing and enforcing property rights is costly.<br />
Property rights only worth enforcing where benefits exceed the costs.</p>
<p>How do property rights change?<br />
Do they change too fast or not fast enough?<br />
Do they become more efficient, or can inefficient arrangements arise and persist?</p>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}

<h2 id="evsey-domar-1970">Evsey Domar (1970)</h2>
<h2 id="domars-trilemma">Domar's trilemma:</h2>
<p>Can only have two of three:</p>
<ol>
<li><strong>Free Land</strong></li>
<li><strong>Free labor</strong></li>
<li><strong>A Rentier landlord class</strong></li>
</ol>
<footer>Capitalist Transition</footer>
</section>

;--theme:gaia;">
<h2 id="open-access-vs-private-property">Open Access vs. Private Property</h2>
<ul>
<li>
<p>Open Access/Commons: any one can enter and use.</p>
<ul>
<li>Captures the average product of labor (APL)</li>

<h3 id="land-insecurity-use-it-or-lose-it-tenure-insecurity-interpretation">Land insecurity (use-it-or-lose-it) tenure insecurity interpretation:</h3>
<ul>
<li>
<p>The worker who enters the unenclosed commons earns an implied land rent<br />
The average product a worker earns by remaining in the unenclosed sector is equal to the local wage in that sector (MPL_c) plus the value of any implied land-rents.</p>
</li>
<li>
<p>In equilibrium the worker earns the same in the commons as a free worker in the enclosed sector.</p>
</li>
</ul>

<h3 id="evolutionary-theories-of-property-rights-1">Evolutionary Theories of Property Rights</h3>
<ul>
<li data-marpit-fragment="1">Assume that property rights are costly to establish and enforce.</li>
<li data-marpit-fragment="2">At low levels of population density and few opportunities for tech/market improvement
<ul>
<li data-marpit-fragment="3">Benefits of enclosure fall short of costs.<br />
More efficient to keep lands unenclosed (customary tenures)</li>
</ul>
</li>
<li data-marpit-fragment="4">As population pressures increase, and/or tech/mkt opportunities improves.
<ul>
<li data-marpit-fragment="5">Benefits of enclosure increase relative to costs.</li>
</ul>
</li>
<li data-marpit-fragment="6">Will private enclosure occur?
<ul>
<li data-marpit-fragment="7">Potential efficiency gain but also rent-shifting gain to encloser.</li>
<li data-marpit-fragment="8">Too much or too little enclosure.</li>
<li data-marpit-fragment="9">will displaced be compensated for loss of informal rights.</li>
</ul>
</li>
</ul>
<footer>Capitalist Transition</footer>

<h3 id="class-conflict-centered-explanations">Class-Conflict centered explanations</h3>

<ul>
<li data-marpit-fragment="1">Earlier Marxist capitalist transition debates.

</ul>
</li>
<li data-marpit-fragment="3">Robert Brenner (1976) and &quot;Political Marxists&quot; such as Ellen Wood criticized the commercialization model.</li>
<li data-marpit-fragment="4">In their view, capitalism was not a natural outcome of economic development, but a political project.</li>
<li data-marpit-fragment="5">New social relations that destroyed the peasantry, imposed capitalist 'imperatives' on workers, landlords, tenants, and capitalists.</li>
</ul>
<footer>Capitalist Transition</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-fragments="5" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="60" data-marpit-pagination-total="100" style="" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-marpit-fragments="8" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="61" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<h3 id="brenner-continued">Brenner (continued)</h3>
<ul>
<li data-marpit-fragment="1">Argued that shift in balance of class forces happened primarily in England.</li>
<li data-marpit-fragment="2">Under feudalism, extra-economic exploitation (coercion), but peasantry had land. Peasant property had strengthened by 16th century.  Landlords did not have strong incentives to accumulate and improve.</li>
<li data-marpit-fragment="3">In 18-19th C shift: peasantry dispossesed via enclosures and elimination of customary tenures.</li>
<li data-marpit-fragment="4">New agrarian capitalism: new 'free' rural wage LLabor proletariat and Landlords, Tenants came under new <em>capitalist imperatives</em>.
<ul>
<li data-marpit-fragment="5">Labor had to work to survive</li>
<li data-marpit-fragment="6">Tenants and landlords had to innovate and cut cost to survive competition.</li>
</ul>
</li>
<li data-marpit-fragment="7">Drove up productivity, innovation, and growth.</li>
<li data-marpit-fragment="8">Labor pushed out of agriculture into industry and urbanization.</li>
</ul>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="62" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<p>New paper by Baker and Conning (2023): &quot;A model of enclosures: Conflict, Coordination, and Efficiency in the Transformation of Property Rights to Land.&quot;</p>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="63" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<h2 id="customary-rights">Customary Rights</h2>
<ul>
<li>&quot;Peasant rights in forests and woodland... grew out of persistent, everyday friction with their lords&quot;.</li>
</ul>
<blockquote>
<p>The 'ancient customs' of Stillington (Yorkshire) specified that the inhabitants of each ancient messuage or cottage could take three wagonloads of turves from the common every year and as much bracken as they could gather between the rising and setting of the sun on 14 September.</p>
</blockquote>
<blockquote>
<p>&quot;custom was mixed up with social relations. Lords had to be careful to ensure that their interest were not overwhelmed by this dynamic... subtle shifts in those daily transactions might gradually see customary regulations shift away from the lord's control.&quot;</p>
</blockquote>
<blockquote>
<p>[but also sometimes] pitted the settled poor against the rootless and utterly destitute.</p>
</blockquote>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="64" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<h2 id="land-enclosures">Land Enclosures</h2>
<ul>
<li>Refers to the fencing or hedging off areas of land for private use that had once been available for common use.</li>
<li>The enclosure of open fields was of accompanied by the 'amalgamation' of strips of land into larger farms ('engrossment').</li>
<li>Arable lands converted to pasture in 16C price rises.</li>
<li>Enclosure led to more exclusive control and to the extinguishing of rights.</li>
<li>Sometimes by agreement between landlord and tenants. But enclosed without consultation.</li>
<li>At its worst, enclosures forced tenant farmers off their land and removed the commons where a village would graze their animals</li>
<li>Sometimes caused entire villages to disappear.</li>
</ul>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="65" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<h2 id="popular-and-societal-resistance-to-enclosures">Popular and societal resistance to enclosures:</h2>
<p>&quot;your sheep that were wont to be so meek and tame, and so small eaters, now, as I hear say, be become so great devourers and so wild, that they eat up, and swallow down the very men themselves. They consume, destroy, and devour whole fields, houses, and cities.&quot;<br />
<strong>Sir Thomas More, Utopia. 1516.</strong></p>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="66" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;--marpit-advanced-background-split:30%;" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;attachments/gr_Kett_oak_1549.jpg&quot;);"></figure></div></section></foreignObject><foreignObject width="70%" height="720"><section id="66" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="66" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;--marpit-advanced-background-split:30%;" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h2 id="ketts-rebellion-1549">Kett's rebellion (1549)</h2>
<ul>
<li>1540s crisis in agricutlure. Inflation, unemployment, rising rents, and declining wages.</li>
<li>Enclosures of common lands, often led to loss of areas to graze animals and access to resources.</li>
<li>Peasants had torn down enclosures, thought they had been acting legally, since there had been edicts against enclosures by Henry VIII.</li>
<li>Peasants in Norfolk and Suffolk, led by yeoman Robert Kett, rebelled against enclosure of common lands and clergy.</li>
</ul>
<footer>Capitalist Transition</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="66" data-marpit-pagination-total="100" style="" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="67" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<h3 id="ketts-rebellion-contd">Kett's Rebellion (contd)</h3>
<blockquote>
<p>29 grievances expressed &quot;desire to limit the power of the gentry, exclude them from the world of the village, constrain rapid economic change, prevent the overexploitation of communal resources, and remodel the values of the clergy&quot;</p>
</blockquote>
<ul>
<li>16000 rebels, multiple confrontations.</li>
<li>3000 killed, 1000 hanged.</li>
</ul>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="68" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<h3 id="protestant-clergyman-robert-crowley-1550">Protestant clergyman Robert Crowley (1550):</h3>
<p>“Cormorants, greedy gulls; yea, men that would eat up men, women, &amp; children... They take our houses over our heads, they buy our lands out of our hands, they raise our rents, they levy great (yea unreasonable) fines, they enclose our commons! No custom, no law or statute can keep them from oppressing us in such sort, that we know not which way to turn so as to live.”</p>
<p>“...lease mongers that cancel leases on land in order to lease it again for double or triple the rent,” [Landlords] should “consider themselves to be but stewards, and not Lords over their possessions.”</p>
<ul>
<li>Yet Crowley told 1549 rebels that they had been misled by the devil: “to revenge wrongs is, in a subject, to take an usurp the office of a king, and, consequently, the office of God.”</li>
</ul>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="69" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<p>Religious opposition to enclosures</p>
<h2 id="historian-rh-tawney-describing-mid-1500s">Historian R.H. Tawney (describing mid 1500s):</h2>
<p>“the popular hatred of the encloser and the engrosser found a natural ally in religious sentiment, schooled, as it was, in a tradition which had taught that the greed of gain was a deadly sin, and that the plea of economic self-interest did not mitigate the verdict, but aggravated the offence.&quot;</p>
<p>“... doctrinal radicalism marched hand in hand with social conservatism. ...saw in economic individualism but another expression of the laxity and licence which had degraded the purity of religion...&quot;</p>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="70" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<h3 id="tudor-enclosures">Tudor Enclosures</h3>
<ul>
<li>Tudor period (1485-1603). Rapid economic growth and state expansion.
<ul>
<li>Dissolution of the monasteries Henry VIII 1530s.</li>
<li>Many enclosures in the period but also commissions of inquiry and legislation to protect peasant rights:
<ul>
<li>Statute of Tillage 1486,  1515 Forest Act.</li>
<li>1536 Common Land Act (enclosures had to be approved by commission and compensation paid to affected)</li>
<li>1547 &quot;Poor Law&quot; system of relief to the poor.</li>
<li>1576 Statue of Artificers (required landlords provide cottages, prevent displacements).</li>
</ul>
</li>
</ul>
</li>
<li>Rise of the Yeoman (successful peasant producers). Property rights strengthened. Expanded tenancies and holdings. Often initiated/benefited from enclosure.</li>
</ul>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-scope-aiBLhYhp="" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="71" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;--marpit-advanced-background-split:40%;" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;attachments/cover_upside_down.jpg&quot;);background-size:400px auto;"></figure></div></section></foreignObject><foreignObject width="60%" height="720"><section id="71" data-marpit-scope-aiBLhYhp="" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="71" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;--marpit-advanced-background-split:40%;" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h2 id="the-diggers-1649">The Diggers 1649</h2>
<ul>
<li>Radical religious and political movements of 17th C: Levellers, Ranters, early Quakers, etc.</li>
<li>Civil war ends w/ Charles I executed.  New commonwealth govt. Leveller term applied to egalitarian factions in New Model Army who advocated 'natural rights' + representation.</li>
<li>'Diggers' or 'True Levellers' nationally organized group of more radical Protestants.</li>
<li>advocated for common ownership of land and an end to private property</li>
<li>In 1648-49 aprox 40 families started to farm common lands in the village of St. George's Hill, Surrey.  Local landowners send gangs and arsonists. Diggers arrested and evicted.</li>
</ul>
<footer>Capitalist Transition</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-scope-aiBLhYhp="" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}

" data-theme="gaia" data-marpit-pagination="72" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<h3 id="diggers-in-popular-culture">Diggers in popular culture</h3>
<p>&quot;The World Turned Upside Down&quot; ballad.</p>
<p>Billy Bragg's popular (folk punk) interpretation (of very much changed lyrics):<br />
<a href="https://www.youtube.com/watch?v=YwQwA_kFxoE">https://www.youtube.com/watch?v=YwQwA_kFxoE</a></p>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="73" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<h2 id="the-english-agricultural-revolution">The English Agricultural Revolution</h2>
<ul>
<li>1520 estimate 80% farmers subsistence, selling little to market.</li>
<li>Yet by 1800 English ag yields were 2X level of middle ages and near highest in the world.</li>
<li>Output per worker 50% higher than next highest European country.</li>
<li>Institutional Revolution:
<ul>
<li>Most open fields had been enclosed</li>
<li>small peasant hoildings into large farms leased to tenants who cultivated them with wage labor.</li>
<li>Concentrated land ownership. High rents, stagnant wages (but pop growing fast).</li>
</ul>
</li>
<li>London rapid growth from 16C.  Great commercial power by 1800, reflecting growing British control over Atlantic trade.</li>
<li>First Industrial Revolution 1760-1830.</li>
</ul>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="74" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<p><img src="attachments/gr_English_pop.png" alt="Image of Gr English Pop" /></p>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="75" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<p>By 1851 Agricultural Census<br />
Britain had strongly concentrated land ownership</p>
<ul>
<li>~4000 largest proprietors owned 60 /% land</li>
<li>Quarter million cultivators (mostly tenants)</li>
<li>Employed ~1.5 million laborers</li>
<li>Peasantry as a group hardly existed.</li>
</ul>
<p>Contrast to France, USA, Russia, Prussia.</p>
<ul>
<li>very different agrarian paths to capitalism.</li>
</ul>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="76" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<h3 id="traditionaltriumphalist-accounts-of-the-agricultural-revolution">Traditional/Triumphalist accounts of the Agricultural Revolution</h3>
<ul>
<li>
<p>Historian Arnold Toynbee <em>Lectures on the Industrial Revolutio in England</em> (1884).</p>
<ul>
<li>an &quot;Agricultural Revolution&quot; (AR) was prior and necessary for the IR.</li>
<li>AR was made possible by the enclosure movement. Swept aside backward and inefficient agriculture (peasant and/or feudal remnants).</li>
<li>Landowners consolidate holdings and experiment with modern agricultural techniques.</li>
<li>Great landlord innovators ( Jethro Tull, Lord Townshend, Arthur Young, ...) and 'improving tenants' .</li>
<li>Innovations raised productivity: selective breeding of livestock, new systems of crop rotations involving turnips and clover.</li>
<li>Drainage and other improvements to land.</li>
</ul>
</li>
<li>
<p>All this raised productivity, allowed for surplus of food to support booming population and labor to the cities booming with trade.</p>
</li>
</ul>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="77" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="77" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<blockquote>
<p>the destruction of the common field system of cultivation; the enclosure, on a large scale, of commons and waste lands; the consolidation of small farms into large ... wrought, without doubt, distinct improvement from an agricultural point of view. They meant substituion of scientific for unscientific culture.</p>
</blockquote>
<p>Arnold Toynbee, <em>Lectures on the Industrial Revolution in England</em> (1884)</p>
<blockquote>
<p>The breakup of the peasantry was the price England paid for the increased supplies of corn and meat to feed her growing population</p>
</blockquote>
<p>Mathias (1983), <em>The First Industrial Nation</em></p>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="78" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<h2 id="agrarian-fundamentalists-allens-term">Agrarian Fundamentalists (Allen's term)</h2>
<p>The view that improved farming, modern agrarian institutions, increase in inequality and first indistrial revolution are connected. It's claims:</p>
<ol>
<li><strong>Technical Revolution was caused by 'modernization'</strong>.<br />
- Traditional and 'feudal' peasant farms and open fields had stifled progress. Replace small backward peasant properties with large 'modern' farms.<br />
- Enclosures and large farms created private property and capitalism.</li>
<li><strong>Growth of agricultural productivity was a pre-requisite for the Industrial Revolution</strong>
<ul>
<li>Enclosures and rising productivity fed the manufacturing cities, provided freed labor and savings for industry.</li>
</ul>
</li>
<li><strong>Increase in Inequality an inherent feature</strong>
<ul>
<li>Tradeoff between equity and growth viewpoint.</li>
</ul>
</li>
</ol>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="79" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<h3 id="agrarian-fundamentalism">Agrarian Fundamentalism</h3>
<ul>
<li><strong>Tory Triumphalists</strong> such as Arthur Young.
<ul>
<li>claim enclosures maintained or increased farm employment.</li>
</ul>
</li>
<li><strong>Marxists</strong> including Robert Brenner and Ellen Wood.
<ul>
<li>claim enclosures led to 'labor shedding.'</li>
<li>Destruction of peasant property to create new  capitalist imperatives, 'necessary' for capitalism/IR.</li>
</ul>
</li>
</ul>
<p>Agrarian Fundamentalism prompted the collectivization of Soviet Agriculture, and influenced agricultural policies through out colonial and post-colonial world.</p>
<blockquote>
<p>For all those who contrast a traditional society with a modern one, for all those who argue that the traditional society must be overturned for development to ocur, for all those who see inequality as the necessary price of growth -- England is the classic case. (Allen, p2)</p>
</blockquote>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="80" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<h3 id="criticisms-of-open-field-system">Criticisms of Open Field System</h3>
<p>Included:</p>
<ol>
<li>overcommitment to Corn growtin</li>
<li>Slow introduction of new crops and methods due to group decision making.</li>
<li>inadequate drainage and weed control due to mixed property, collective decisions.</li>
<li>communal grazing made selective breeding difficult, and also spread disease.</li>
</ol>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="81" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<p><img src="attachments/gr_enclosure_acts.jpg" alt="Image of Gr Enclosure Acts" /></p>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="82" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<h2 id="marx-and-marxists-on-labor-expulsion">Marx and Marxists on labor expulsion</h2>
<blockquote>
<p>The expropriation and expulsion of the agricultural population, intermittent but renewed again and again, supplied ... the town industries with a mass of proletarians</p>
</blockquote>
<p>Karl Marx, 1867</p>
<blockquote>
<p>both landlords and tenants were compelled [by] ... the imperatives of competition ... new forms of appropriation established new compulsions ... in large part by the dispossesion of the peasantry.</p>
</blockquote>
<p>Ellen Wood, p66</p>
<blockquote>
<p>the characteristic ideology that set England apart ... was above all the ideology of 'improvement': not the Enlightenment idea of the improvement of humanity but the improvement of <em>property</em>, the ethic -- and indeed the science of profit ... the practice of enclosure and dispossession.  Ellen Wood, p.183</p>
</blockquote>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="83" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="83" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<h2 id="allens-view-and-findings">Allen's view and findings</h2>
<ul>
<li>“two agricultural revolutions,” one by yeomen farmers in the seventeenth century and another by landlords in the eighteenth,</li>
<li>&quot;large farms and enclosures were not necessary for the technical revolution in agriculture.&quot;</li>
<li>Studied effect of enclosuree and farm size on cropping, employment and yields in South Midlands.  How easily did labor shift to manufacturing? What happened to wages, profits, and rents?</li>
<li>the “great inventions” —clover/turnips, convertible husbandry, and New Leicester sheep— were scant contributors.</li>
</ul>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="84" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<p>Food consumption:</p>
<ul>
<li>steadily rising output from 1520 to 1739</li>
<li>stagnation during the period 1740-1800, with output up by just 10 percent
<ul>
<li>Food consumption per capita actually fell, from a peak no higher than the levels of the sixteenth.</li>
</ul>
</li>
<li>renewed acceleration from 1800 to 1850, increasing by 65 percent.</li>
</ul>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="85" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<h2 id="rise-and-fall-of-the-yeoman">Rise and Fall of the Yeoman</h2>
<ul>
<li>
<p>Black death popn decline destabilized serfdom.</p>
</li>
<li>
<p>Labor mobility and wages increased, rents collapsed.</p>
</li>
<li>
<p>Early enclosure and conversion to pasture were seigniorial response to new order.</p>
</li>
<li>
<p>1 of 10 villages in midlands destroyed between 1450-1525.</p>
</li>
<li>
<p>This eliminated small-scale agriculture and transition to capitalist agriculture.</p>
</li>
<li>
<p>Reaction to enclosures actually strengthened consolidation of peasant agriculture, created secure forms of tenure.</p>
</li>
<li>
<p>Yeomen were owner-occupier farmers.  They were responsible for most productivity growth -- the agricultural revolution.</p>
</li>
<li>
<p>The later landlords revolution eliminated the yeomen, by concentrating ownership in great estates, creating large leased farms.</p>
<ul>
<li>In 18th C many yeomen sold property to landlords, others lost their land when landlords changed terms. Fueled in part by growing mortgage market.</li>
</ul>
</li>
</ul>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="86" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="86" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<h3 id="open-fields-a-barrier-to-productivity-improvements">Open fields a barrier to productivity improvements?</h3>
<ul>
<li>Allen argues larger portion of agricultural improvement happened in yeoman agricultural revolution.  Productivity doubled between 1500-1800. Enclosure played minor role.</li>
</ul>
<p>In later landlord revolution period, did enclosure lead to new adoptions:</p>
<ul>
<li>In heavy-soil arable regions yes -- enclosed villages more likely to improve.</li>
<li>In light-soil regions also more likely to adopt new crop rotations.</li>
<li>But these do not represent large productivity gains.</li>
<li>In 1800 yiled in open and enclosed fields were similar.</li>
</ul>
<p>On employment:</p>
<ul>
<li>Enclosure had little if any effect when it did not change tillage/pasture. Where led to conversion to pasture, employment declined. In pastoral areas, the Marxist labor shedding is clsoer to the facts.</li>
</ul>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="87" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="87" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<p>On rents:</p>
<ul>
<li>they increased a lot. Combined with finding that enclosure did not raise productivity, Allen argues that enclosure represented redistribution of income from farmers to landlords.</li>
<li>Real rents increased about seven fold between 1450-1850.</li>
</ul>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="88" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;attachments/gr_allenRev1.png&quot;);background-size:800px auto;"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="88" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="88" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;" data-marpit-advanced-background="content"><footer>Capitalist Transition</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="88" data-marpit-pagination-total="100" style="" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="89" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;" data-marpit-advanced-background="background"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;attachments/gr_allenRev2.png&quot;);background-size:800px auto;"></figure></div></section></foreignObject><foreignObject width="1280" height="720"><section id="89" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="89" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;" data-marpit-advanced-background="content"><footer>Capitalist Transition</footer>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="89" data-marpit-pagination-total="100" style="" data-marpit-advanced-background="pseudo"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="90" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="90" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<blockquote>
<p>The seventeenth century yeomen were the decisive contributors. They accomplished mos of the growth in yields and about half of the rise in labour productivity... the main contribution of the landlords' agricultural revlolution was further shedding of labor in the 18th century. While this did push labor productivity to record levels, it was of secondary importance to the achievement of the yeomen.<br />
Most of the productivity gains of the agricultural revolution accrued to the large landowners as rent increases. ...spent ofrtunes on stately homes and elegant living.  Agriculture made little contribution towards promoting  industrial capital formation.<br />
17 century rising agricultural productivity did release labor to cities.<br />
By early 19th century, enclosure and technical change no longer raised yields. Enclosures reduced employment per acre but the labor released was not successfully employed in manufacturing.  By the early 19th century, the agricultural revolution was producing pupers -- not proletarians.</p>
</blockquote>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="91" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="91" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<h2 id="enclosures-and-agricultural-productivity">Enclosures and Agricultural Productivity</h2>
<ul>
<li>Robert C. Allen's book <em>Enclosure and the Yeoman</em> challenged the traditional view that enclosures were necessary for agricultural productivity.</li>
<li>He argued that enclosure did not lead to increased productivity, and that open field systems, in which peasants had access to common land, had already achieved high levels of productivity.</li>
<li>He suggested that productivity gains in agriculture were due to innovations in technology and methods of farming, not enclosure.</li>
</ul>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="92" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="92" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<h2 id="agrarian-fundamentalism-1">Agrarian Fundamentalism</h2>
<ul>
<li>Allen criticized the &quot;agrarian fundamentalism&quot; of Alwyn Young and other champions of enclosure who believed that removing peasant property rights and customary tenures was necessary for increasing productivity.</li>
<li>According to Allen, the evidence from the South Midlands showed that yeoman farmers on open fields had raised agricultural productivity, disproving the view of the agrarian fundamentalists.</li>
</ul>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="93" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="93" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<h3 id="british-agricultural-revolution-1500-1800">British Agricultural Revolution 1500-1800</h3>
<p><img src="attachments/gr_bull.jpg" alt="Image of Gr Bull" style="width:300px;" /></p>
<ul>
<li>Transition from organic ag system to more energy-intensive inputs.</li>
<li>new crop rotations involving turnips and clover.</li>
<li>Changes and innovations
<ul>
<li>new plows and seed drills.</li>
<li>selective breeding of livestock</li>
<li>land reclamation (drainage of fenlands and irrigation)</li>
</ul>
</li>
</ul>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="94" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="94" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<ul>
<li>Large parts of Eastern England were fenlands, marshes, and peat bogs.<br />
<img src="attachments/gr_thefens.jpg" alt="Image of Gr Thefens" /></li>
<li>Acts of Parliament 1740 to 1840 drained 1.5 million acres of land.</li>
</ul>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="95" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="95" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<ul>
<li>
<p>Rising labor productivity</p>
</li>
<li>
<p>England's population grew from 3.5 million to 9 million between 1500 and 1800.</p>
</li>
<li>
<p>Great men.. &quot;Great Inventors&quot;  and &quot;Great Innovators&quot; narratives.</p>
</li>
</ul>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="96" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="96" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<h2 id="debated-agricultural-revolution">Debated 'agricultural revolution'</h2>
<ul>
<li>Agricultural Statistics are sparse, so much speculation in early period. Cereal Statistics in Britain not collected systematically until 1880s.</li>
<li><strong>Greg Clark</strong>: 'enclosure was mainly a capital investment induced by higher land rents relative to wages, with very little associated productivity gains.'</li>
<li>Slow and steady vs. 'revolution'</li>
</ul>
<blockquote>
<p>[From 1500 to 1869] English agricultural output seems to have tripled,and [TFP]  increased by about 50%.   But this was achieved over a very long period with few abrupt changes so that the rate of growth of productivity per years was on average 0.15% ... in any twenty year period farmers would be unable to discern, given the noise of year to year fluctuations, that productivity was actually increasing.</p>
</blockquote>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="97" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="97" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<h2 id="push-or-pull">Push or Pull?</h2>
<ul>
<li>What certainly happened is the structural transformation of the economy: people moved from rural areas to urban.  From agriculture to manufacturing.</li>
<li>The agricultural revolution story, is a 'Push' story: rising ag productivity released labor for industry.
<ul>
<li>Allen pointed out that in landlords revolution, rural unemployment rose. So labor shedding, but not absorbed into industry.</li>
</ul>
</li>
<li>But maybe it was more of a 'Pull' story: rising wages in industry attracted labor from agriculture.</li>
<li></li>
</ul>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="98" data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
" data-theme="gaia" data-marpit-pagination="98" data-marpit-pagination-total="100" style="--paginate:true;--footer:Capitalist Transition;--style:section {font-size: 26px;}
;--theme:gaia;">
<h2 id="farm-structures-and-productivity">Farm structures and productivity</h2>
<p>The second and third agricultural revolution</p>
<ul>
<li>Modern economic growth &gt; 1870. Only then did labor costs start to rise.</li>
<li>Might have expected move to more capital-intensive agriculture throughout Europe.  Instead 'green revolution' or rising land productivity (new fertilizers). This is when yields really started to rise.</li>
<li>European continent built agricultural extension services to help farmers adopt new technologies.  Not the case in Britain.</li>
</ul>
<footer>Capitalist Transition</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-footer="Capitalist Transition" data-style="section {font-size: 26px;}
